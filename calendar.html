<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<meta name="theme-color" content="#071426">
<title>支部カレンダー｜埼玉土建 上尾伊奈支部</title>
<link rel="stylesheet" href="assets/css/tabler-icons.min.css">
<link rel="stylesheet" href="common.css">
<style>
body{
  background:#071426;
}
.calendar-page{
  max-width:760px;
  font-weight:400;
  background:
    radial-gradient(circle at 88px 140px,rgba(232,97,42,.16),transparent 150px),
    radial-gradient(circle at 92% 220px,rgba(38,127,213,.22),transparent 210px),
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px),
    #071426;
  background-size:auto,auto,42px 42px,42px 42px,auto;
}
.calendar-page .content{
  padding:18px 16px 96px;
}
.calendar-hero{
  display:grid;
  grid-template-columns:86px 1fr;
  gap:16px;
  align-items:center;
  padding:22px 20px;
  margin-bottom:16px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:24px;
  background:linear-gradient(135deg,rgba(30,65,118,.94),rgba(18,36,68,.94));
  box-shadow:0 18px 40px rgba(0,0,0,.22);
  overflow:hidden;
  position:relative;
}
.calendar-hero::after{
  content:"";
  position:absolute;
  right:-42px;
  top:-62px;
  width:190px;
  height:190px;
  border-radius:50%;
  background:rgba(255,255,255,.06);
}
.calendar-icon{
  width:78px;
  height:78px;
  border-radius:22px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#F4772E,#C63428);
  color:#fff;
  box-shadow:0 14px 26px rgba(232,97,42,.32);
  position:relative;
  z-index:1;
}
.calendar-icon i{font-size:40px;}
.calendar-hero h1{
  margin:0 0 5px;
  color:#fff;
  font-size:26px;
  line-height:1.25;
  font-weight:700;
}
.calendar-hero p{
  margin:0;
  color:#C7D3E4;
  font-size:14px;
  font-weight:500;
  line-height:1.65;
}
.today-card{
  display:grid;
  grid-template-columns:82px 1fr;
  align-items:center;
  gap:14px;
  padding:16px 18px;
  margin-bottom:14px;
  border:1px solid rgba(117,204,235,.28);
  border-radius:18px;
  background:rgba(22,48,91,.82);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);
}
.date-block{
  text-align:center;
  color:#fff;
  line-height:1;
}
.date-block strong{
  display:block;
  font-size:42px;
  font-weight:700;
}
.date-block span{
  display:block;
  color:#75D6F6;
  font-size:15px;
  font-weight:700;
  margin-top:6px;
}
.today-text b{
  display:flex;
  align-items:center;
  gap:7px;
  color:#9BE7FF;
  font-size:17px;
  font-weight:600;
  margin-bottom:6px;
}
.today-text p{
  margin:0;
  color:#DCE7F5;
  font-size:15px;
  font-weight:500;
}
.today-category-color{display:inline-block;width:10px;height:10px;margin-right:7px;border-radius:50%;vertical-align:1px;box-shadow:0 0 0 3px rgba(255,255,255,.1);}
.view-tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  margin-bottom:14px;
  border:1px solid rgba(232,97,42,.65);
  border-radius:15px;
  overflow:hidden;
  background:rgba(22,48,91,.72);
}
.view-btn{
  border:0;
  min-height:56px;
  color:#C6D4E8;
  background:transparent;
  font-size:15px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
}
.view-btn + .view-btn{border-left:1px solid rgba(232,97,42,.45);}
.view-btn.active{
  background:linear-gradient(135deg,#0871DB,#005BC5);
  color:#fff;
}
.view-btn i{font-size:18px;}
.calendar-shell{
  margin-bottom:18px;
  overflow:hidden;
  border-radius:24px;
  border:2px solid rgba(232,97,42,.32);
  background:#F8FAFC;
  box-shadow:0 20px 48px rgba(0,0,0,.32);
}
.calendar-frame{
  width:100%;
  height:650px;
  border:0;
  display:block;
  background:#fff;
}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 12px;flex-wrap:wrap;}
.section-label{display:flex;align-items:center;gap:10px;margin:0;color:#9BE7FF;font-size:20px;font-weight:700;}
.agenda-shell{width:100%;border-radius:18px;border:1px solid rgba(232,97,42,.48);background:rgba(17,43,85,.74);box-shadow:0 16px 36px rgba(0,0,0,.22);overflow:hidden;}
.agenda-list{display:flex;flex-direction:column;gap:10px;padding:10px;min-width:0;}
.agenda-card{display:grid;grid-template-columns:58px 6px minmax(0,1fr) 28px;gap:10px;align-items:stretch;min-height:112px;padding:12px 10px;border:1px solid rgba(232,97,42,.42);border-radius:15px;background:rgba(23,50,97,.9);box-shadow:inset 0 0 0 1px rgba(255,255,255,.035);color:inherit;text-decoration:none;overflow:hidden;transition:transform .16s ease,border-color .16s ease,background .16s ease;}
.agenda-card[href]:active{transform:scale(.985);}
.agenda-card:focus-visible{outline:3px solid #75D6F6;outline-offset:2px;}
.agenda-date{align-self:center;text-align:center;color:#fff;line-height:1;}
.agenda-date strong{display:block;margin:3px 0 5px;font-size:34px;font-weight:700;}
.agenda-month{display:block;color:#AFC1D6;font-size:12px;font-weight:700;}
.agenda-weekday{display:block;font-size:13px;font-weight:700;}
.agenda-weekday.weekday-0{color:#FF9C9C;}
.agenda-weekday.weekday-6{color:#8FBCFF;}
.agenda-accent{width:6px;min-height:72px;align-self:stretch;border-radius:999px;background:var(--category-color,#616161);}
.agenda-body{min-width:0;align-self:center;}
.agenda-category{display:inline-flex;align-items:center;min-height:24px;margin-bottom:5px;padding:3px 9px;border:1px solid color-mix(in srgb,var(--category-color,#616161) 68%,white);border-radius:999px;background:color-mix(in srgb,var(--category-color,#616161) 24%,transparent);color:#F4F8FF;font-size:11px;font-weight:700;line-height:1.2;}
.agenda-title{margin:0 0 5px;color:#fff;font-size:17px;font-weight:700;line-height:1.4;font-family:var(--font-base);letter-spacing:.01em;overflow-wrap:anywhere;}
.agenda-meta{display:flex;align-items:flex-start;gap:5px;margin:2px 0 0;color:#AFC1D6;font-size:13px;font-weight:500;line-height:1.45;font-family:var(--font-base);overflow-wrap:anywhere;}
.agenda-meta i{flex:0 0 auto;margin-top:2px;font-size:14px;color:#9BE7FF;}
.agenda-arrow{align-self:center;display:grid;place-items:center;width:28px;height:44px;color:#9BE7FF;font-size:22px;}
.agenda-message{margin:0;padding:26px 18px;color:#D8E4F2;font-size:14px;font-weight:600;line-height:1.7;text-align:center;}
.agenda-status{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-height:32px;color:#AFC1D6;font-size:12px;font-weight:600;line-height:1.4;}
.agenda-status.is-saved span:first-child,.agenda-status.is-warning span:first-child,.agenda-status.is-error span:first-child{padding:4px 8px;border-radius:999px;}
.agenda-status.is-saved span:first-child{background:#213A5A;color:#C5D9F0;}
.agenda-status.is-warning span:first-child{background:#4A3511;color:#FFE09A;}
.agenda-status.is-error span:first-child{background:#4A2020;color:#FFC1C1;}
.agenda-retry{min-height:44px;padding:8px 12px;border:1px solid rgba(117,214,246,.5);border-radius:12px;background:#153B68;color:#EAF8FF;font:inherit;cursor:pointer;}
.agenda-skeleton{pointer-events:none;}
.skeleton-date,.skeleton-line,.skeleton-body{display:block;border-radius:10px;background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.16),rgba(255,255,255,.06));background-size:220% 100%;animation:skeleton-shimmer 1.25s ease-in-out infinite;}
.skeleton-date{width:46px;height:62px;align-self:center;}
.skeleton-line{width:6px;min-height:72px;background:rgba(255,255,255,.12);}
.skeleton-body{width:82%;height:62px;align-self:center;}
@keyframes skeleton-shimmer{to{background-position:-220% 0;}}
@media (prefers-reduced-motion:reduce){.agenda-card,.skeleton-date,.skeleton-line,.skeleton-body{animation:none;transition:none;}}
html[data-theme="light"] .calendar-page{
  background:#F4F7FB;
}
html[data-theme="light"] .today-card,
html[data-theme="light"] .view-tabs{
  background:#FFFFFF;
  border-color:#D8DBE3;
}
html[data-theme="light"] .date-block strong{color:#1B2A3B;}
html[data-theme="light"] .today-text p{color:#334155;}
html[data-theme="light"] .view-btn{color:#334155;}
html[data-theme="light"] .agenda-shell{
  background:#FFFFFF;
  border-color:#D8DBE3;
}
html[data-theme="light"] .section-label{color:#164B7D;}
html[data-theme="light"] .agenda-card{background:#F8FAFC;border-color:#CBD5E1;box-shadow:0 4px 14px rgba(15,23,42,.07);}
html[data-theme="light"] .agenda-date{color:#172638;}
html[data-theme="light"] .agenda-month{color:#475569;}
html[data-theme="light"] .agenda-weekday{color:#334155;}
html[data-theme="light"] .agenda-weekday.weekday-0{color:#B4232B;}
html[data-theme="light"] .agenda-weekday.weekday-6{color:#2457A6;}
html[data-theme="light"] .agenda-category{color:#172638;background:color-mix(in srgb,var(--category-color,#616161) 13%,white);}
html[data-theme="light"] .agenda-title{color:#172638;}
html[data-theme="light"] .agenda-meta{color:#334155;}
html[data-theme="light"] .agenda-meta i,html[data-theme="light"] .agenda-arrow{color:#24669E;}
html[data-theme="light"] .agenda-message,html[data-theme="light"] .agenda-status{color:#334155;}
html[data-theme="light"] .agenda-status.is-saved span:first-child{background:#E2E8F0;color:#334155;}
html[data-theme="light"] .agenda-status.is-warning span:first-child{background:#FFF2CC;color:#6B4B00;}
html[data-theme="light"] .agenda-status.is-error span:first-child{background:#FDE2E2;color:#8F1D1D;}
html[data-theme="light"] .agenda-retry{background:#FFFFFF;color:#164B7D;border-color:#8FB5D5;}
html[data-theme="light"] .skeleton-date,html[data-theme="light"] .skeleton-line,html[data-theme="light"] .skeleton-body{background:linear-gradient(90deg,#E2E8F0,#F8FAFC,#E2E8F0);background-size:220% 100%;}
@media (max-width:520px){
  .calendar-page .content{padding:16px 12px 92px;}
  .calendar-hero{grid-template-columns:70px 1fr;padding:18px 16px;border-radius:22px;}
  .calendar-icon{width:64px;height:64px;border-radius:18px;}
  .calendar-icon i{font-size:34px;}
  .calendar-hero h1{font-size:22px;}
  .calendar-hero p{font-size:13px;}
  .today-card{grid-template-columns:66px 1fr;padding:14px;}
  .date-block strong{font-size:36px;}
  .view-btn{font-size:14px;min-height:52px;}
  .calendar-frame{height:620px;}
  .section-heading{align-items:flex-start;}
  .agenda-status{width:100%;justify-content:space-between;}
  .agenda-shell{border-radius:14px;}
  .agenda-list{padding:8px;gap:9px;}
  .agenda-card{grid-template-columns:50px 5px minmax(0,1fr) 24px;gap:8px;padding:12px 8px;}
  .agenda-date strong{font-size:29px;}
  .agenda-title{font-size:16px;}
  .agenda-arrow{width:24px;}
}
</style>
</head>
<body>
<div class="app calendar-page">
<header class="hdr">
  <button class="hdr-back" onclick="goBack()">
    <i class="ti ti-arrow-left"></i>戻る
  </button>
  <div style="text-align:right;">
    <p class="hdr-org" style="margin:0;">埼玉土建 上尾伊奈支部</p>
    <p class="hdr-title" style="margin:0;font-size:14px;">支部カレンダー</p>
  </div>
</header>

<div class="content">
  <section class="calendar-hero">
    <div class="calendar-icon"><i class="ti ti-calendar-event"></i></div>
    <div>
      <h1>支部カレンダー</h1>
      <p>会議・行事・相談日を確認できます。Googleカレンダー側で更新すると自動反映されます。</p>
    </div>
  </section>

  <section class="today-card">
    <div class="date-block">
      <strong id="today-day">--</strong>
      <span id="today-week">--</span>
    </div>
    <div class="today-text">
      <b><i class="ti ti-calendar"></i>今日の予定</b>
      <p><span class="today-category-color" id="today-category-color" hidden></span><span id="today-summary">予定を確認しています…</span></p>
    </div>
  </section>

  <nav class="view-tabs" aria-label="表示切替">
    <button class="view-btn active" type="button" data-calendar-mode="MONTH"><i class="ti ti-calendar-month"></i>月表示</button>
    <button class="view-btn" type="button" data-calendar-mode="WEEK"><i class="ti ti-calendar-week"></i>週表示</button>
    <button class="view-btn" type="button" data-calendar-mode="AGENDA"><i class="ti ti-clipboard-list"></i>リスト</button>
  </nav>

  <section class="calendar-shell" id="calendar-shell">
    <iframe
      id="gcal"
      class="calendar-frame"
      title="埼玉土建 上尾伊奈支部 カレンダー"
      frameborder="0"
      scrolling="auto">
    </iframe>
  </section>

  <div class="section-heading">
    <h2 class="section-label" id="upcoming-heading"><i class="ti ti-clipboard-list"></i>今後の予定</h2>
    <div class="agenda-status is-loading" id="agenda-status" aria-live="polite">今後45日間の予定を読み込んでいます…</div>
  </div>
  <section class="agenda-shell" id="agenda-shell" aria-labelledby="upcoming-heading">
    <div class="agenda-list" id="agenda-list" role="list" aria-live="polite" aria-busy="true">
      <div class="agenda-card agenda-skeleton" aria-hidden="true"><span class="skeleton-date"></span><span class="skeleton-line"></span><span class="skeleton-body"></span></div>
      <div class="agenda-card agenda-skeleton" aria-hidden="true"><span class="skeleton-date"></span><span class="skeleton-line"></span><span class="skeleton-body"></span></div>
      <div class="agenda-card agenda-skeleton" aria-hidden="true"><span class="skeleton-date"></span><span class="skeleton-line"></span><span class="skeleton-body"></span></div>
    </div>
  </section>
</div>

<footer>埼玉土建一般労働組合 上尾伊奈支部｜TEL <a href="tel:048-773-9863">048-773-9863</a></footer>
</div>

<script src="assets/js/calendar-config.js"></script>
<script src="assets/js/calendar-upcoming.js"></script>
<script src="assets/js/navigation.js"></script>
</body>
</html>
