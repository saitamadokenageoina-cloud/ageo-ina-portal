<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<meta name="theme-color" content="#071426">
<title>支部カレンダー｜埼玉土建 上尾伊奈支部</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css">
<link rel="stylesheet" href="common.css">
<style>
body{
  background:#071426;
}
.calendar-page{
  max-width:760px;
  background:
    radial-gradient(circle at 88px 140px,rgba(232,97,42,.16),transparent 150px),
    radial-gradient(circle at 92% 220px,rgba(38,127,213,.22),transparent 210px),
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px),
    #071426;
  background-size:auto,auto,42px 42px,42px 42px,auto;
}
.calendar-page .content{
  padding:18px 16px 96px;
}
.calendar-hero{
  display:grid;
  grid-template-columns:86px 1fr;
  gap:16px;
  align-items:center;
  padding:22px 20px;
  margin-bottom:16px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:24px;
  background:linear-gradient(135deg,rgba(30,65,118,.94),rgba(18,36,68,.94));
  box-shadow:0 18px 40px rgba(0,0,0,.22);
  overflow:hidden;
  position:relative;
}
.calendar-hero::after{
  content:"";
  position:absolute;
  right:-42px;
  top:-62px;
  width:190px;
  height:190px;
  border-radius:50%;
  background:rgba(255,255,255,.06);
}
.calendar-icon{
  width:78px;
  height:78px;
  border-radius:22px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#F4772E,#C63428);
  color:#fff;
  box-shadow:0 14px 26px rgba(232,97,42,.32);
  position:relative;
  z-index:1;
}
.calendar-icon i{font-size:40px;}
.calendar-hero h1{
  margin:0 0 5px;
  color:#fff;
  font-size:26px;
  line-height:1.25;
  font-weight:900;
}
.calendar-hero p{
  margin:0;
  color:#C7D3E4;
  font-size:14px;
  font-weight:700;
  line-height:1.65;
}
.today-card{
  display:grid;
  grid-template-columns:82px 1fr;
  align-items:center;
  gap:14px;
  padding:16px 18px;
  margin-bottom:14px;
  border:1px solid rgba(117,204,235,.28);
  border-radius:18px;
  background:rgba(22,48,91,.82);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);
}
.date-block{
  text-align:center;
  color:#fff;
  line-height:1;
}
.date-block strong{
  display:block;
  font-size:42px;
  font-weight:950;
}
.date-block span{
  display:block;
  color:#75D6F6;
  font-size:15px;
  font-weight:900;
  margin-top:6px;
}
.today-text b{
  display:flex;
  align-items:center;
  gap:7px;
  color:#9BE7FF;
  font-size:17px;
  margin-bottom:6px;
}
.today-text p{
  margin:0;
  color:#DCE7F5;
  font-size:15px;
  font-weight:700;
}
.view-tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  margin-bottom:14px;
  border:1px solid rgba(232,97,42,.65);
  border-radius:15px;
  overflow:hidden;
  background:rgba(22,48,91,.72);
}
.view-btn{
  border:0;
  min-height:56px;
  color:#C6D4E8;
  background:transparent;
  font-size:15px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
}
.view-btn + .view-btn{border-left:1px solid rgba(232,97,42,.45);}
.view-btn.active{
  background:linear-gradient(135deg,#0871DB,#005BC5);
  color:#fff;
}
.view-btn i{font-size:18px;}
.calendar-shell{
  margin-bottom:18px;
  overflow:hidden;
  border-radius:24px;
  border:2px solid rgba(232,97,42,.32);
  background:#F8FAFC;
  box-shadow:0 20px 48px rgba(0,0,0,.32);
}
.calendar-frame{
  width:100%;
  height:650px;
  border:0;
  display:block;
  background:#fff;
}
.section-label{
  display:flex;
  align-items:center;
  gap:10px;
  color:#9BE7FF;
  font-size:20px;
  font-weight:900;
  margin:6px 0 12px;
}
.agenda-shell{
  display:block;
  width:calc(100% + 20px);
  margin-left:-10px;
  margin-right:-10px;
  border-radius:18px;
  border:1px solid rgba(232,97,42,.48);
  background:rgba(17,43,85,.74);
  box-shadow:0 16px 36px rgba(0,0,0,.22);
  padding:0;
}
.agenda-list{
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:10px;
}
.agenda-card{
  display:grid;
  grid-template-columns:64px 1fr;
  gap:12px;
  align-items:center;
  min-height:96px;
  padding:14px;
  border:1px solid rgba(232,97,42,.42);
  background:rgba(23,50,97,.9);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.035);
}
.agenda-date{text-align:center;color:#fff;line-height:1;}
.agenda-date strong{display:block;font-size:34px;font-weight:950;}
.agenda-date span{display:block;margin-top:6px;color:#B8C8DC;font-size:14px;font-weight:900;}
.agenda-body{
  position:relative;
  padding-left:18px;
  border-left:7px solid #8A8F99;
}
/* Googleカレンダーの色と完全一致 */
.agenda-body.branch{border-left-color:#616161;}   /* #616161 グレー  saitamadokenageoina */
.agenda-body.branch2{border-left-color:#0B8043;}  /* #0b8043 緑      班会議等 */
.agenda-body.event{border-left-color:#D81B60;}    /* #d81b60 ピンク  行事・大会 */
.agenda-body.training{border-left-color:#F4511E;} /* #f4511e オレンジ 研修・講習 */
.agenda-body.consult{border-left-color:#F09300;}  /* #f09300 黄      役員会議 */
.agenda-body.other{border-left-color:#8E24AA;}    /* #8e24aa 紫      その他 */
.agenda-body.deadline{border-left-color:#F4511E;} /* 互換用 */
.agenda-body.holiday{border-left-color:#4285F4;}  /* #4285f4 青      祝日 */
.agenda-title{
  margin:0 0 5px;
  color:#fff;
  font-size:17px;
  font-weight:800;
  line-height:1.35;
  font-family:var(--font-base);
  letter-spacing:.01em;
}
.agenda-meta{
  margin:0;
  color:#AFC1D6;
  font-size:13px;
  font-weight:700;
  line-height:1.6;
  font-family:var(--font-base);
}
.agenda-empty{
  padding:22px 18px;
  color:#D8E4F2;
  font-size:14px;
  font-weight:800;
  line-height:1.7;
  text-align:center;
}
@keyframes spin{to{transform:rotate(360deg)}}
.agenda-fallback{
  padding:8px;
}
.agenda-fallback-note{
  margin:0 0 10px;
  color:#D8E4F2;
  font-size:13px;
  font-weight:800;
  line-height:1.6;
}
.agenda-fallback-frame{
  width:100%;
  height:520px;
  border:0;
  display:block;
  border-radius:14px;
  background:#fff;
  filter:invert(.9) hue-rotate(180deg) saturate(.82) contrast(.98);
}
html[data-theme="light"] .calendar-page{
  background:#F4F7FB;
}
html[data-theme="light"] .today-card,
html[data-theme="light"] .view-tabs{
  background:#FFFFFF;
  border-color:#D8DBE3;
}
html[data-theme="light"] .date-block strong{color:#1B2A3B;}
html[data-theme="light"] .today-text p{color:#334155;}
html[data-theme="light"] .view-btn{color:#334155;}
html[data-theme="light"] .agenda-shell{
  background:#FFFFFF;
  border-color:#D8DBE3;
}
html[data-theme="light"] .agenda-card{background:#F8FAFC;}
html[data-theme="light"] .agenda-title{color:#172638;}
html[data-theme="light"] .agenda-meta{color:#334155;}
@media (max-width:520px){
  .calendar-page .content{padding:16px 12px 92px;}
  .calendar-hero{grid-template-columns:70px 1fr;padding:18px 16px;border-radius:22px;}
  .calendar-icon{width:64px;height:64px;border-radius:18px;}
  .calendar-icon i{font-size:34px;}
  .calendar-hero h1{font-size:22px;}
  .calendar-hero p{font-size:13px;}
  .today-card{grid-template-columns:66px 1fr;padding:14px;}
  .date-block strong{font-size:36px;}
  .view-btn{font-size:14px;min-height:52px;}
  .calendar-frame{height:620px;}
  .agenda-shell{width:calc(100% + 24px);margin-left:-12px;margin-right:-12px;border-radius:14px;}
  .agenda-list{padding:8px;gap:9px;}
  .agenda-card{grid-template-columns:52px 1fr;gap:10px;padding:12px 10px;}
  .agenda-date strong{font-size:30px;}
  .agenda-fallback-frame{height:500px;}
}
@media (min-width:760px){
  .agenda-shell{width:calc(100% + 32px);margin-left:-16px;margin-right:-16px;}
}
</style>
</head>
<body>
<div class="app calendar-page">
<header class="hdr">
  <button class="hdr-back" onclick="goBack()">
    <i class="ti ti-arrow-left"></i>戻る
  </button>
  <div style="text-align:right;">
    <p class="hdr-org" style="margin:0;">埼玉土建 上尾伊奈支部</p>
    <p class="hdr-title" style="margin:0;font-size:14px;">支部カレンダー</p>
  </div>
</header>

<div class="content">
  <section class="calendar-hero">
    <div class="calendar-icon"><i class="ti ti-calendar-event"></i></div>
    <div>
      <h1>支部カレンダー</h1>
      <p>会議・行事・相談日を確認できます。Googleカレンダー側で更新すると自動反映されます。</p>
    </div>
  </section>

  <section class="today-card">
    <div class="date-block">
      <strong id="today-day">--</strong>
      <span id="today-week">--</span>
    </div>
    <div class="today-text">
      <b><i class="ti ti-calendar"></i>今日の日付</b>
      <p>Googleカレンダーで最新の予定を確認してください</p>
    </div>
  </section>

  <nav class="view-tabs" aria-label="表示切替">
    <button class="view-btn active" type="button" onclick="switchView('MONTH',this)"><i class="ti ti-calendar-month"></i>月表示</button>
    <button class="view-btn" type="button" onclick="switchView('WEEK',this)"><i class="ti ti-calendar-week"></i>週表示</button>
    <button class="view-btn" type="button" onclick="switchView('AGENDA',this)"><i class="ti ti-clipboard-list"></i>リスト</button>
  </nav>

  <section class="calendar-shell" id="calendar-shell">
    <iframe
      id="gcal"
      class="calendar-frame"
      title="埼玉土建 上尾伊奈支部 カレンダー"
      frameborder="0"
      scrolling="auto">
    </iframe>
  </section>

  <div class="section-label"><i class="ti ti-clipboard-list"></i>今後の予定</div>
  <section class="agenda-shell" id="agenda-shell">
    <div class="agenda-list" id="agenda-list">
      <div class="agenda-empty" id="agenda-loading" style="display:flex;align-items:center;justify-content:center;gap:10px;">
        <i class="ti ti-loader-2" style="font-size:22px;animation:spin 1s linear infinite;"></i>
        今後1週間の予定を読み込んでいます…
      </div>
    </div>
  </section>
</div>

<footer>埼玉土建一般労働組合 上尾伊奈支部｜TEL <a href="tel:048-773-9863">048-773-9863</a></footer>
</div>

<script>
// ===== Google Calendar API方式（吉見SMCと同一実装） =====
const API_KEY = 'AIzaSyAcwXq2eLqpJNLJKy8clba4PpuBQE90FEU';

const CALENDAR_QUERY = 'height=600&wkst=1&ctz=Asia%2FTokyo&showPrint=0&showTabs=0&showCalendars=0&showTz=0&src=c2FpdGFtYWRva2VuYWdlb2luYUBnbWFpbC5jb20&src=OTIwZGY5NzEyMmJjNjJjYjg0ODUyNDI4ZjAxOTI4NTAwZDQzMGIwMGE1YWNlZjQ0OGQ2ZWI2NzlkOGNkZjFmYkBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&src=NTQxNjFiNDgzY2ZhYTEzZjA1NjQ4MjRmNGZhZWZiMjlkZTE0MGRiOWVkYWYxMTM1NGE3ZTdhYjFlYTg0YTliYkBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&src=ZTAxOGRmZTE0Njc1MGI3YzkxNTI2NzAzYTBiZDg3OTQ2NDAzYzU0YTcyZjRjY2FlOWQ1ZDNhZDdmNGJhYTA4OUBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&src=YjA3N2RjOGQzYzRhMzI5MjZhMTdjYTdhYjU1ZmIwZDdmM2ExY2JkYTMwMDAxMmVhNmE0MDg2MWQyNmU3MjI4ZEBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&src=ZmVkNzhiZWJhZmFkYjNjNDZkMmEwMjNhMDI1NDllNWNkYWRmMzJhZDU2ZTU0NDRmNDBhNWFjOTljM2I2OGJkOEBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&src=amEuamFwYW5lc2Uub2ZmaWNpYWwjaG9saWRheUBncm91cC52LmNhbGVuZGFyLmdvb2dsZS5jb20&color=%23616161&color=%230b8043&color=%23d81b60&color=%23f4511e&color=%23f09300&color=%238e24aa&color=%234285f4';
const CALENDAR_BASE = 'https://calendar.google.com/calendar/embed?' + CALENDAR_QUERY + '&mode=';

// カレンダーID・色・typeの定義
const CALENDARS = [
  { id: 'saitamadokenageoina@gmail.com',                                                                    color: '#616161', type: 'branch'   },
  { id: '920df97122bc62cb84852428f01928500d430b00a5acef448d6eb679d8cdf1fb@group.calendar.google.com',      color: '#0b8043', type: 'branch2'  },
  { id: '54161b483cfaa13f0564824f4faefb29de140db9edaf11354a7e7ab1ea84a9bb@group.calendar.google.com',      color: '#d81b60', type: 'event'    },
  { id: 'e018dfe146750b7c91526703a0bd87946403c54a72f4ccae9d5d3ad7f4baa089@group.calendar.google.com',      color: '#f4511e', type: 'training' },
  { id: 'b077dc8d3c4a32926a17ca7ab55fb0d7f3a1cbda300012ea6a40861d26e7228d@group.calendar.google.com',      color: '#f09300', type: 'consult'  },
  { id: 'fed78bebafadb3c46d2a023a02549e5cdadf32ad56e5444f40a5ac99c3b68bd8@group.calendar.google.com',      color: '#8e24aa', type: 'other'    },
];

function setToday(){
  const now = new Date();
  const weeks = ['日曜日','月曜日','火曜日','水曜日','木曜日','金曜日','土曜日'];
  document.getElementById('today-day').textContent = String(now.getDate());
  document.getElementById('today-week').textContent = weeks[now.getDay()];
}

function switchView(mode, btn){
  document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('gcal').src = CALENDAR_BASE + mode;
}

async function loadUpcoming(){
  const now = new Date();
  const weekLater = new Date(now);
  weekLater.setDate(now.getDate() + 7);

  const timeMin = now.toISOString();
  const timeMax = weekLater.toISOString();

  // 全カレンダーを並列取得
  const promises = CALENDARS.map(cal => {
    const url = 'https://www.googleapis.com/calendar/v3/calendars/'
      + encodeURIComponent(cal.id)
      + '/events?key=' + API_KEY
      + '&timeMin=' + encodeURIComponent(timeMin)
      + '&timeMax=' + encodeURIComponent(timeMax)
      + '&singleEvents=true'
      + '&orderBy=startTime'
      + '&maxResults=20';

    return fetch(url)
      .then(res => res.ok ? res.json() : { items: [] })
      .then(data => (data.items || []).map(ev => ({
        title:   ev.summary || '(無題)',
        start:   ev.start.dateTime || ev.start.date,
        end:     ev.end.dateTime   || ev.end.date,
        allDay:  !ev.start.dateTime,
        location: ev.location || '',
        color:   cal.color,
        type:    cal.type,
      })))
      .catch(() => []);
  });

  Promise.all(promises).then(results => {
    // ローディング非表示
    const loading = document.getElementById('agenda-loading');
    if(loading) loading.style.display = 'none';

    const events = results.flat().sort((a, b) => a.start.localeCompare(b.start));
    renderUpcoming(events);
  });
}

function renderUpcoming(events){
  const list = document.getElementById('agenda-list');
  const DAYS = ['日','月','火','水','木','金','土'];

  if(!events.length){
    list.innerHTML = '<div class="agenda-empty">今後1週間の予定はありません。</div>';
    return;
  }

  list.innerHTML = events.slice(0, 20).map(ev => {
    const d = new Date(ev.start.slice(0, 10) + 'T00:00:00');
    const dow = d.getDay();

    let timeStr;
    if(ev.allDay){
      timeStr = '終日';
    } else {
      const s = new Date(ev.start);
      const e = new Date(ev.end);
      const hm = t => String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0');
      timeStr = hm(s) + '〜' + hm(e);
    }

    // 場所をコンパクトに（住所を省略）
    const locShort = ev.location
      ? ev.location.replace(/,?\s*日本.*/, '').replace(/〒\d{3}-\d{4}\s*/, '').split(',')[0].trim().slice(0, 20)
      : '';

    const dowClass = dow === 0 ? ' style="color:#CC3B3B;" ' : dow === 6 ? ' style="color:#3A66C0;" ' : '';

    return `<article class="agenda-card">
      <div class="agenda-date">
        <strong>${d.getDate()}</strong>
        <span ${dowClass}>${DAYS[dow]}</span>
      </div>
      <div class="agenda-body ${ev.type}">
        <p class="agenda-title">${escHtml(ev.title)}</p>
        <p class="agenda-meta">${timeStr}${locShort ? '　' + escHtml(locShort) : ''}</p>
      </div>
    </article>`;
  }).join('');
}

function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

setToday();
document.getElementById('gcal').src = CALENDAR_BASE + 'MONTH';
loadUpcoming();
</script>
<script src="assets/js/navigation.js"></script>
