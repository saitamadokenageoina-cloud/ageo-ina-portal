<body>
<div class="reader" id="reader">
  <header class="reader-top">
    <button class="reader-back" id="back-btn" aria-label="資料本棚へ戻る"><i class="ti ti-arrow-left"></i><span>本棚</span></button>
    <div class="reader-title"><strong id="book-title">デジタルブック</strong><span id="book-sub">資料を開いています…</span></div>
    <div class="top-actions">
      <button class="top-action" data-open="toc" aria-label="目次"><i class="ti ti-list-tree"></i><span class="top-label">目次</span></button>
      <button class="top-action" data-open="thumbs" aria-label="ページ一覧"><i class="ti ti-layout-grid"></i><span class="top-label">ページ一覧</span></button>
      <button class="top-action" id="bookmark-btn" aria-label="このページをしおりに保存"><i class="ti ti-bookmark"></i></button>
      <button class="top-action" data-open="tools" aria-label="その他の操作"><i class="ti ti-dots"></i></button>
    </div>
  </header>

  <main class="stage" id="stage" aria-label="デジタルブック本文">
    <button class="stage-edge prev" id="prev-hit" aria-label="前のページ"></button>
    <span class="edge-cue prev"><i class="ti ti-chevron-left"></i></span>
    <div class="pages-transform" id="pages-transform">
      <div class="page-shell left" id="left-shell"><canvas id="left-page"></canvas><span class="page-no" id="left-no"></span></div>
      <div class="page-shell right" id="right-shell"><canvas id="right-page"></canvas><span class="page-no" id="right-no"></span></div>
    </div>
    <span class="edge-cue next"><i class="ti ti-chevron-right"></i></span>
    <button class="stage-edge next" id="next-hit" aria-label="次のページ"></button>
    <div class="loading" id="loading"><div class="loading-card"><div class="loading-title">資料を開いています…</div><div class="progress"><span id="progress-bar"></span></div><div class="progress-text" id="progress-text">読み込みを開始しています</div></div></div>
    <div class="reader-error" id="reader-error"><div class="error-card"><i class="ti ti-file-alert"></i><h2>資料を開けませんでした</h2><p>通信状態を確認して、もう一度お試しください。</p><div class="error-actions"><button class="error-btn primary" id="retry-btn">もう一度読み込む</button><a class="error-btn" id="error-pdf" href="#" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:center;text-decoration:none">PDFで開く</a><button class="error-btn" id="error-back">資料本棚へ戻る</button></div></div></div>
  </main>

  <footer class="reader-bottom">
    <button class="bottom-btn" id="prev-btn" aria-label="前のページ"><i class="ti ti-chevron-left"></i><span class="bottom-label">前へ</span></button>
    <button class="bottom-btn page-jump" id="page-jump" aria-label="ページ番号を指定して移動"><span id="page-label">-- / --</span></button>
    <div class="zoom-tools">
      <button class="bottom-btn" id="zoom-out" aria-label="縮小"><i class="ti ti-zoom-out"></i></button>
      <span class="zoom-value" id="zoom-value">100%</span>
      <button class="bottom-btn" id="zoom-in" aria-label="拡大"><i class="ti ti-zoom-in"></i></button>
      <button class="bottom-btn" id="next-btn" aria-label="次のページ"><i class="ti ti-chevron-right"></i><span class="bottom-label">次へ</span></button>
    </div>
  </footer>
</div>

<div class="backdrop" id="backdrop"></div>
<aside class="sheet side" id="sheet-toc" aria-label="目次"><div class="sheet-head"><strong>目次</strong><button class="sheet-close" data-close aria-label="閉じる"><i class="ti ti-x"></i></button></div><div class="sheet-body" id="toc-list"><div class="empty">目次を読み込んでいます…</div></div></aside>
<aside class="sheet bottom" id="sheet-thumbs" aria-label="ページ一覧"><div class="sheet-handle"></div><div class="sheet-head"><strong>ページ一覧</strong><button class="sheet-close" data-close aria-label="閉じる"><i class="ti ti-x"></i></button></div><div class="sheet-body"><div class="thumb-grid" id="thumb-grid"></div></div></aside>
<aside class="sheet side" id="sheet-search" aria-label="本文検索"><div class="sheet-head"><strong>本文検索</strong><button class="sheet-close" data-close aria-label="閉じる"><i class="ti ti-x"></i></button></div><div class="sheet-body"><div class="search-box"><input id="search-input" type="search" inputmode="search" placeholder="例：国保、共済、健康診断"><button id="search-btn">検索</button></div><div class="search-status" id="search-status">キーワードを入力してください</div><div id="search-results"></div></div></aside>
<aside class="sheet side" id="sheet-bookmarks" aria-label="しおり一覧"><div class="sheet-head"><strong>しおり</strong><button class="sheet-close" data-close aria-label="閉じる"><i class="ti ti-x"></i></button></div><div class="sheet-body" id="bookmark-list"></div></aside>
<aside class="sheet bottom" id="sheet-tools" aria-label="その他の操作"><div class="sheet-handle"></div><div class="sheet-head"><strong>表示・その他</strong><button class="sheet-close" data-close aria-label="閉じる"><i class="ti ti-x"></i></button></div><div class="sheet-body"><div class="tool-grid"><button class="tool-btn" data-open="search"><i class="ti ti-search"></i>本文検索</button><button class="tool-btn" data-open="bookmarks"><i class="ti ti-bookmarks"></i>しおり一覧</button><button class="tool-btn" id="share-btn"><i class="ti ti-share"></i>このページを共有</button><button class="tool-btn" id="view-btn"><i class="ti ti-book-2"></i><span id="view-label">表示：自動</span></button><button class="tool-btn" id="fullscreen-btn"><i class="ti ti-arrows-maximize"></i>全画面</button><a class="tool-btn" id="pdf-link" href="#" target="_blank" rel="noopener"><i class="ti ti-file-type-pdf"></i>PDF表示</a><a class="tool-btn" id="save-link" href="#" download><i class="ti ti-download"></i>PDF保存</a></div></div></aside>

<div class="dialog-wrap" id="jump-wrap" role="dialog" aria-modal="true" aria-label="ページへ移動"><div class="jump-dialog"><h2>ページへ移動</h2><p id="jump-help">ページ番号を入力してください。</p><input id="jump-input" type="number" min="1" inputmode="numeric"><div class="jump-actions"><button class="jump-btn" id="jump-cancel">キャンセル</button><button class="jump-btn primary" id="jump-go">移動</button></div></div></div>

<script>
(function(){

const $=id=>document.getElementById(id);
const els={reader:$('reader'),stage:$('stage'),pages:$('pages-transform'),leftShell:$('left-shell'),rightShell:$('right-shell'),leftCanvas:$('left-page'),rightCanvas:$('right-page'),leftNo:$('left-no'),rightNo:$('right-no'),title:$('book-title'),sub:$('book-sub'),pageLabel:$('page-label'),zoomValue:$('zoom-value'),loading:$('loading'),progressBar:$('progress-bar'),progressText:$('progress-text'),error:$('reader-error'),pdf:$('pdf-link'),save:$('save-link'),errorPdf:$('error-pdf'),backdrop:$('backdrop'),toc:$('toc-list'),thumbs:$('thumb-grid'),searchInput:$('search-input'),searchStatus:$('search-status'),searchResults:$('search-results'),bookmarkBtn:$('bookmark-btn'),bookmarkList:$('bookmark-list'),viewLabel:$('view-label')};

function saveBookmarkPages(pages){const all=currentBookmarks();all[doc.id]=pages;localStorage.setItem('doken_bookmarks_v1',JSON.stringify(all));}
function updateBookmarkButton(){const on=bookmarkPages().includes(state.page);els.bookmarkBtn.classList.toggle('bookmarked',on);els.bookmarkBtn.innerHTML=`<i class="ti ${on?'ti-bookmark-filled':'ti-bookmark'}"></i>`;els.bookmarkBtn.setAttribute('aria-label',on?'このページのしおりを削除':'このページをしおりに保存');}
function renderBookmarks(){const pages=bookmarkPages().sort((a,b)=>a-b);els.bookmarkList.innerHTML=pages.length?pages.map(p=>`<button class="bookmark-item" data-page="${p}"><strong>ページ ${p}</strong><span>開く</span></button>`).join(''):'<div class="empty">まだ、しおりはありません。<br>読み返したいページで上部のしおりボタンを押してください。</div>';els.bookmarkList.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{jump(Number(b.dataset.page));closeSheets();}));}
function toggleBookmark(){let pages=bookmarkPages();const i=pages.indexOf(state.page);if(i>=0)pages.splice(i,1);else pages.push(state.page);saveBookmarkPages(pages);updateBookmarkButton();renderBookmarks();}
async function render(){if(!state.pdf)return;state.page=clamp(state.page,1,maxPage());cancelRenders();const token=++state.token;els.loading.style.display='flex';els.error.style.display='none';els.reader.classList.remove('turn-next','turn-prev');els.rightShell.style.display=spread()?'block':'none';try{await draw(state.page,els.leftCanvas,els.leftShell,els.leftNo,token);if(spread())await draw(state.page+1,els.rightCanvas,els.rightShell,els.rightNo,token);if(token!==state.token)return;els.pageLabel.textContent=pageText();els.zoomValue.textContent=Math.round(state.zoom*100)+'%';els.sub.textContent=`${doc.category||'資料'} / ${maxPage()}ページ`;applyPan();updateUrl();updateBookmarkButton();markActiveThumb();preloadNeighbors();}catch(e){if(!(e&&e.name==='RenderingCancelledException')){console.error(e);showError();}}finally{if(token===state.token)els.loading.style.display='none';}}
function preloadNeighbors(){[state.page-step(),state.page+step(),state.page+step()*2].filter(p=>p>=1&&p<=maxPage()).forEach(p=>state.pdf.getPage(p).catch(()=>{}));}
function go(delta){if(!state.pdf)return;const next=clamp(state.page+delta,1,maxPage());if(next===state.page)return;state.panX=state.panY=0;els.reader.classList.add(delta>0?'turn-next':'turn-prev');state.page=next;render();setTimeout(()=>els.reader.classList.remove('turn-next','turn-prev'),300);}
function jump(p){state.panX=state.panY=0;state.page=clamp(Math.round(p||1),1,maxPage());render();}
function setZoom(z){state.zoom=clamp(Math.round(z*100)/100,1,4);if(state.zoom===1){state.panX=0;state.panY=0;}render();}
function openSheet(name){closeSheets(false);const sheet=$('sheet-'+name);if(!sheet)return;els.backdrop.classList.add('open');sheet.classList.add('open');if(name==='thumbs')ensureThumbs();if(name==='bookmarks')renderBookmarks();if(name==='search')setTimeout(()=>els.searchInput.focus(),160);}
function closeSheets(hideBackdrop=true){document.querySelectorAll('.sheet.open').forEach(s=>s.classList.remove('open'));if(hideBackdrop)els.backdrop.classList.remove('open');}
async function resolveOutlinePage(item){try{const dest=typeof item.dest==='string'?await state.pdf.getDestination(item.dest):item.dest;if(!dest||!dest[0])return null;return(await state.pdf.getPageIndex(dest[0]))+1;}catch(e){return null;}}
async function buildToc(){let rows=[];try{const outline=await state.pdf.getOutline();async function walk(items,depth){for(const item of items||[]){const p=await resolveOutlinePage(item);if(p)rows.push({title:item.title||`ページ ${p}`,page:p,depth});if(item.items&&item.items.length)await walk(item.items,depth+1);}}await walk(outline||[],0);}catch(e){}if(!rows.length&&Array.isArray(doc.toc))rows=doc.toc.map(x=>({title:x.title,page:x.page,depth:x.depth||0}));if(!rows.length){const stride=maxPage()<=20?2:maxPage()<=50?5:10;rows=[{title:'表紙',page:1,depth:0}];for(let p=1+stride;p<=maxPage();p+=stride)rows.push({title:`ページ ${p} から`,page:p,depth:0});}els.toc.innerHTML=rows.map(r=>`<button class="toc-item" data-page="${r.page}" style="padding-left:${10+r.depth*14}px"><span>${esc(r.title)}</span><span>P.${r.page}</span></button>`).join('');els.toc.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{jump(Number(b.dataset.page));closeSheets();}));}
function ensureThumbs(){if(els.thumbs.children.length)return;const frag=document.createDocumentFragment();for(let p=1;p<=maxPage();p++){const b=document.createElement('button');b.className='thumb';b.dataset.page=p;b.innerHTML=`<canvas class="thumb-canvas" width="120" height="160" aria-label="ページ ${p} のサムネイル"></canvas><span>${p}</span>`;b.addEventListener('click',()=>{jump(p);closeSheets();});frag.appendChild(b);}els.thumbs.appendChild(frag);state.thumbObserver=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting){renderThumb(entry.target).catch(()=>{});state.thumbObserver.unobserve(entry.target);}});},{root:$('sheet-thumbs').querySelector('.sheet-body'),rootMargin:'160px'});els.thumbs.querySelectorAll('.thumb').forEach(t=>state.thumbObserver.observe(t));markActiveThumb();}
async function renderThumb(btn){if(btn.dataset.rendered)return;btn.dataset.rendered='1';const p=Number(btn.dataset.page);const page=await state.pdf.getPage(p);const base=page.getViewport({scale:1});const scale=Math.min(130/base.width,170/base.height);const vp=page.getViewport({scale});const c=btn.querySelector('canvas');c.width=Math.max(1,Math.floor(vp.width));c.height=Math.max(1,Math.floor(vp.height));const ctx=c.getContext('2d',{alpha:false});await page.render({canvasContext:ctx,viewport:vp,intent:'display'}).promise;}
function markActiveThumb(){els.thumbs.querySelectorAll('.thumb').forEach(t=>{const p=Number(t.dataset.page);t.classList.toggle('active',p===state.page||(spread()&&p===state.page+1));});const active=els.thumbs.querySelector('.thumb.active');if(active&&$('sheet-thumbs').classList.contains('open'))active.scrollIntoView({block:'nearest',inline:'center'});}
async function getPageText(p){if(state.textCache.has(p))return state.textCache.get(p);const page=await state.pdf.getPage(p);const tc=await page.getTextContent();const text=tc.items.map(i=>i.str).join(' ').replace(/\s+/g,' ').trim();state.textCache.set(p,text);return text;}
async function search(){const q=els.searchInput.value.trim().toLowerCase();if(!q){els.searchStatus.textContent='キーワードを入力してください';els.searchResults.innerHTML='';return;}els.searchResults.innerHTML='';let hits=[];for(let p=1;p<=maxPage();p++){els.searchStatus.textContent=`検索中… ${p} / ${maxPage()}ページ`;try{const text=await getPageText(p);const low=text.toLowerCase();const idx=low.indexOf(q);if(idx>=0){const s=Math.max(0,idx-36),e=Math.min(text.length,idx+q.length+55);hits.push({page:p,snippet:(s?'…':'')+text.slice(s,e)+(e<text.length?'…':'')});}}catch(e){}await new Promise(r=>setTimeout(r,0));}els.searchStatus.textContent=`${hits.length}件見つかりました`;els.searchResults.innerHTML=hits.length?hits.map(h=>`<button class="search-item" data-page="${h.page}"><div><strong>ページ ${h.page}</strong><div class="search-snippet">${esc(h.snippet)}</div></div><span><i class="ti ti-chevron-right"></i></span></button>`).join(''):'<div class="empty">該当するページがありません。</div>';els.searchResults.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{jump(Number(b.dataset.page));closeSheets();}));}
function cycleView(){state.view=state.view==='auto'?'single':state.view==='single'?'spread':'auto';els.viewLabel.textContent=state.view==='auto'?'表示：自動':state.view==='single'?'表示：1ページ':'表示：見開き';state.panX=state.panY=0;render();}
async function sharePage(){const url=location.href;const data={title:doc.title,text:`${doc.title}（${state.page}ページ）`,url};try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(url);alert('このページのURLをコピーしました。');}}catch(e){if(e&&e.name!=='AbortError')alert('共有できませんでした。');}}
function toggleFullscreen(){const root=document.documentElement;if(!document.fullscreenElement&&root.requestFullscreen){root.requestFullscreen().catch(()=>{});}else if(document.exitFullscreen){document.exitFullscreen().catch(()=>{});}}
function openJump(){if(!state.pdf)return;$('jump-input').max=maxPage();$('jump-input').value=state.page;$('jump-help').textContent=`1〜${maxPage()}ページの番号を入力してください。`;$('jump-wrap').classList.add('open');setTimeout(()=>$('jump-input').select(),60);}
function closeJump(){$('jump-wrap').classList.remove('open');}
function distance(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);}
function midpoint(a,b){return{x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2};}
let lastTap=0;
els.stage.addEventListener('touchstart',e=>{if(e.touches.length===2){const m=midpoint(e.touches[0],e.touches[1]);state.pinch={dist:distance(e.touches[0],e.touches[1]),zoom:state.zoom,x:m.x,y:m.y};state.touch=null;return;}if(e.touches.length===1){const t=e.touches[0];state.touch={x:t.clientX,y:t.clientY,lastX:t.clientX,lastY:t.clientY,time:Date.now()};}}, {passive:true});
els.stage.addEventListener('touchmove',e=>{if(e.touches.length===2&&state.pinch){e.preventDefault();const d=distance(e.touches[0],e.touches[1]);const next=clamp(state.pinch.zoom*(d/state.pinch.dist),1,4);state.zoom=Math.round(next*100)/100;els.zoomValue.textContent=Math.round(state.zoom*100)+'%';return;}if(e.touches.length===1&&state.touch&&state.zoom>1){e.preventDefault();const t=e.touches[0];state.panX+=t.clientX-state.touch.lastX;state.panY+=t.clientY-state.touch.lastY;state.touch.lastX=t.clientX;state.touch.lastY=t.clientY;applyPan();}}, {passive:false});
els.stage.addEventListener('touchend',e=>{if(state.pinch&&e.touches.length<2){state.pinch=null;render();return;}if(!state.touch||!e.changedTouches.length)return;const t=e.changedTouches[0],dx=t.clientX-state.touch.x,dy=t.clientY-state.touch.y,dt=Date.now()-state.touch.time;state.touch=null;if(state.zoom>1)return;if(dt<650&&Math.abs(dx)>46&&Math.abs(dx)>Math.abs(dy)*1.2){go(dx<0?step():-step());return;}const now=Date.now();if(dt<260&&Math.abs(dx)<12&&Math.abs(dy)<12){if(now-lastTap<330){lastTap=0;setZoom(state.zoom>1?1:2);}else lastTap=now;}}, {passive:true});
$('back-btn').addEventListener('click',()=>location.href='shiryo.html');$('error-back').addEventListener('click',()=>location.href='shiryo.html');$('retry-btn').addEventListener('click',()=>boot());$('prev-btn').addEventListener('click',()=>go(-step()));$('next-btn').addEventListener('click',()=>go(step()));$('prev-hit').addEventListener('click',()=>{if(state.zoom===1)go(-step());});$('next-hit').addEventListener('click',()=>{if(state.zoom===1)go(step());});$('zoom-out').addEventListener('click',()=>setZoom(state.zoom-.25));$('zoom-in').addEventListener('click',()=>setZoom(state.zoom+.25));$('page-jump').addEventListener('click',openJump);$('jump-cancel').addEventListener('click',closeJump);$('jump-go').addEventListener('click',()=>{jump(Number($('jump-input').value));closeJump();});$('jump-input').addEventListener('keydown',e=>{if(e.key==='Enter')$('jump-go').click();});els.bookmarkBtn.addEventListener('click',toggleBookmark);document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openSheet(b.dataset.open)));document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closeSheets()));els.backdrop.addEventListener('click',()=>closeSheets());$('search-btn').addEventListener('click',search);els.searchInput.addEventListener('keydown',e=>{if(e.key==='Enter')search();});$('view-btn').addEventListener('click',cycleView);$('share-btn').addEventListener('click',sharePage);$('fullscreen-btn').addEventListener('click',toggleFullscreen);$('jump-wrap').addEventListener('click',e=>{if(e.target===$('jump-wrap'))closeJump();});
if(!document.documentElement.requestFullscreen)$('fullscreen-btn').style.display='none';
window.addEventListener('resize',()=>{state.panX=state.panY=0;render();});window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(-step());else if(e.key==='ArrowRight')go(step());else if(e.key==='Home')jump(1);else if(e.key==='End')jump(maxPage());else if(e.key==='Escape'){closeSheets();closeJump();}});
async function boot(){if(!doc){showError();return;}els.title.textContent=doc.title;document.title=doc.title+'｜デジタルブック';els.pdf.href=doc.file;els.save.href=doc.file;els.errorPdf.href=doc.file;els.loading.style.display='flex';els.error.style.display='none';setProgress(4,'PDFを読み込んでいます…');if(!window.pdfjsLib){showError();return;}try{const task=pdfjsLib.getDocument({url:doc.file,cMapUrl:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',cMapPacked:true,standardFontDataUrl:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/standard_fonts/'});task.onProgress=p=>{if(p&&p.total)setProgress((p.loaded/p.total)*100,`${Math.round((p.loaded/p.total)*100)}%`);};state.pdf=await task.promise;state.page=clamp(state.page,1,maxPage());setProgress(100,'表示を準備しています…');await buildToc();renderBookmarks();await render();}catch(e){console.error(e);showError();}}
boot();
})();
</script>
