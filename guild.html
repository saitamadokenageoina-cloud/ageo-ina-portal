<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOKENギルド｜埼玉土建 上尾伊奈支部</title>
<link rel="stylesheet" href="assets/css/tabler-icons.min.css">
<link rel="stylesheet" href="common.css">
<style>
/* ===== タブ ===== */
.tab-row{display:flex;gap:4px;background:var(--gray100);border-radius:var(--r12);padding:4px;margin-bottom:16px;}
.t-btn{flex:1;min-width:0;border:none;border-radius:var(--r8);padding:9px 2px;font-size:12px;font-weight:600;color:var(--gray600);background:none;cursor:pointer;transition:all .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.t-btn.active{background:var(--white);color:var(--navy);box-shadow:var(--shadow-sm);}

/* ===== 投稿カード ===== */
.post-card{background:var(--white);border-radius:var(--r16);box-shadow:var(--shadow-sm);padding:16px;margin-bottom:10px;border-left:4px solid transparent;}
.post-card.jinzai{border-left-color:#E8612A;}
.post-card.shizai{border-left-color:#1A7A4A;}
.post-card.soudan{border-left-color:#6B21A8;}
.post-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.post-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:var(--gray100);}
.post-author{font-size:14px;font-weight:600;color:var(--navy);margin:0 0 1px;}
.post-meta{font-size:12px;color:var(--gray600);margin:0;font-weight:600;}
.post-badge{margin-left:auto;font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap;flex-shrink:0;}
.badge-jinzai{background:#FEE8D6;color:#9B3A1A;}
.badge-shizai{background:#E8F5EE;color:#1A4A2A;}
.badge-soudan{background:#EDE8FE;color:#4A1A9B;}
.post-body{font-size:15px;color:var(--gray900);margin:0 0 10px;line-height:1.65;}
.post-flags{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 9px;}
.status-chip,.urgent-chip{display:inline-flex;align-items:center;min-height:24px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;}
.status-open{background:#E8F5EE;color:#1A4A2A;}.status-negotiating{background:#FFF4D6;color:#6B4B00;}.status-closed{background:#E2E8F0;color:#475569;}
.urgent-chip{background:#FDE2E2;color:#9B1C1C;}
.post-details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:0 0 10px;}
.post-detail{min-width:0;padding:7px 9px;border-radius:9px;background:var(--gray50);color:var(--gray700);font-size:12px;overflow-wrap:anywhere;}
.post-detail strong{color:var(--navy);font-weight:700;}
.post-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.post-tag{font-size:12px;background:var(--gray50);color:var(--gray600);padding:3px 10px;border-radius:99px;font-weight:500;}
.post-actions{display:flex;gap:8px;}
.post-btn{flex:1;padding:9px;border-radius:var(--r8);border:1.5px solid var(--gray200);background:none;font-size:13px;font-weight:600;color:var(--gray600);display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s;cursor:pointer;}
.post-btn:hover{border-color:var(--orange);color:var(--orange);}
.post-btn.primary{background:var(--orange);color:#fff;border-color:var(--orange);}
.post-btn.primary:hover{background:var(--orange-dk);}
.post-btn.danger{color:var(--red);border-color:#F2C8C2;}
.post-btn.danger:hover{background:var(--red-lt);border-color:var(--red);}
.post-btn i{font-size:15px;}

/* コメント */
.comment-area{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--gray100);}
.comment-area.open{display:block;}
.comment-item{display:flex;gap:8px;margin-bottom:8px;}
.comment-avatar{width:28px;height:28px;border-radius:50%;background:var(--gray100);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.comment-body{background:var(--gray50);border-radius:var(--r8);padding:8px 12px;flex:1;}
.comment-author{font-size:12px;font-weight:600;color:var(--navy);margin:0 0 2px;}
.comment-text{font-size:13px;color:var(--gray700);margin:0;}
.comment-input-row{display:flex;gap:8px;margin-top:8px;}
.comment-input{flex:1;padding:8px 12px;border-radius:var(--r8);border:1.5px solid var(--gray200);font-size:13px;background:var(--white);color:var(--gray900);outline:none;}
.comment-input:focus{border-color:var(--orange);}
.comment-send{background:var(--orange);border:none;border-radius:var(--r8);color:#fff;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0;}

/* ===== 投稿ボタン ===== */
.fab{
  position:fixed;bottom:104px;left:50%;transform:translateX(-50%);
  width:calc(100% - 32px);max-width:608px;
  background:var(--orange);color:#fff;border:none;border-radius:var(--r16);
  padding:15px 20px;font-size:16px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 8px 24px rgba(232,97,42,.4);cursor:pointer;transition:all .15s;
}
.fab:hover{background:var(--orange-dk);}

/* ===== モーダル ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal-sheet{background:var(--white);border-radius:var(--r24) var(--r24) 0 0;padding:24px 20px 40px;width:100%;max-width:640px;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);}
.modal-overlay.open .modal-sheet{transform:translateY(0);}
.modal-title{font-size:18px;font-weight:700;color:var(--navy);margin:0 0 16px;}
.modal-close{position:absolute;top:20px;right:20px;background:var(--gray100);border:none;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;}

/* カテゴリ選択チップ */
.cat-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.cat-chip{padding:8px 16px;border-radius:99px;border:2px solid var(--gray200);font-size:13px;font-weight:600;color:var(--gray600);cursor:pointer;background:var(--white);transition:all .15s;}
.cat-chip.jinzai.sel{background:#FEE8D6;color:#9B3A1A;border-color:#E8612A;}
.cat-chip.shizai.sel{background:#E8F5EE;color:#1A4A2A;border-color:#1A7A4A;}
.cat-chip.soudan.sel{background:#EDE8FE;color:#4A1A9B;border-color:#6B21A8;}

/* 空状態 */
.empty-state{text-align:center;padding:40px 20px;color:var(--gray600);font-weight:600;}
.empty-state i{font-size:48px;display:block;margin-bottom:12px;opacity:.4;}
.empty-state p{font-size:15px;margin:0;}

/* 注意バナー */
.guild-notice{background:#1B2A3B;border-radius:var(--r12);padding:12px 16px;display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.guild-notice i{font-size:20px;color:var(--orange);flex-shrink:0;}
.guild-notice p{font-size:13px;color:rgba(255,255,255,.8);margin:0;font-weight:500;}
.guild-toolbar{display:flex;gap:8px;margin-bottom:12px;}
.guild-toolbar button{flex:1;border:1.5px solid var(--gray200);background:var(--white);border-radius:var(--r12);padding:9px 10px;font-size:13px;font-weight:600;color:var(--gray600);}
.guild-toolbar button.active{background:#1B2A3B;color:#fff;border-color:var(--navy);}
.sync-status{font-size:12px;color:var(--gray600);margin:-6px 0 12px;text-align:right;font-weight:600;}
.guild-controls{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:8px;margin-bottom:10px;}
.guild-search,.guild-sort{width:100%;min-height:44px;border:1.5px solid var(--gray200);border-radius:var(--r12);background:var(--white);color:var(--gray900);font:inherit;font-size:13px;padding:8px 12px;}
.guild-search:focus,.guild-sort:focus{outline:3px solid rgba(232,97,42,.2);border-color:var(--orange);}
.archive-btn{width:100%;min-height:44px;margin-bottom:12px;border:1.5px solid var(--gray200);border-radius:var(--r12);background:var(--white);color:var(--gray600);font-size:13px;font-weight:600;}
.archive-btn.active{background:#1B2A3B;color:#fff;border-color:#1B2A3B;}
.job-fields{display:none;padding:12px;margin:0 0 14px;border:1px solid var(--gray200);border-radius:var(--r12);background:var(--gray50);}
.job-fields.open{display:block;}
.check-row{display:flex;align-items:center;gap:9px;min-height:44px;margin-bottom:12px;font-size:14px;font-weight:600;color:var(--gray700);}
.check-row input{width:20px;height:20px;accent-color:var(--orange);}
.form-note{margin:0 0 14px;padding:10px 12px;border-radius:var(--r8);background:#E8F0FB;color:#234B76;font-size:12px;line-height:1.6;}
html[data-theme="dark"] .tab-row{background:#071426;border:1px solid rgba(255,255,255,.12);}
html[data-theme="dark"] .t-btn{color:#D8E4F2;background:#13243A;}
html[data-theme="dark"] .t-btn.active{background:#E8612A;color:#fff;box-shadow:none;}
html[data-theme="dark"] .post-card{background:#0F1F35;border-color:rgba(255,255,255,.12);}
html[data-theme="dark"] .post-author,
html[data-theme="dark"] .comment-author{color:#fff!important;}
html[data-theme="dark"] .post-meta,
html[data-theme="dark"] .sync-status{color:#B8C7DA!important;}
html[data-theme="dark"] .post-body,
html[data-theme="dark"] .comment-text{color:#E8EEF7!important;}
html[data-theme="dark"] .post-tag{background:#071426;color:#D8E4F2!important;border:1px solid rgba(255,255,255,.12);}
html[data-theme="dark"] .post-detail{background:#071426;color:#D8E4F2;border:1px solid rgba(255,255,255,.1);}
html[data-theme="dark"] .post-detail strong{color:#fff;}
html[data-theme="dark"] .comment-body{background:#071426!important;border:1px solid rgba(255,255,255,.12);}
html[data-theme="dark"] .comment-input{background:#071426;color:#fff;border-color:rgba(255,255,255,.22);}
html[data-theme="dark"] .post-btn{background:#071426;color:#E8EEF7;border-color:rgba(255,255,255,.18);}
html[data-theme="dark"] .post-btn:hover{background:#13243A;color:#FFB15C;border-color:#FFB15C;}
html[data-theme="dark"] .post-btn.primary{background:#E8612A;color:#fff;border-color:#E8612A;}
html[data-theme="dark"] .post-btn.danger{background:#2A1010;color:#FFD1D1;border-color:#D76A6A;}
html[data-theme="dark"] .modal-sheet{background:#0F1F35;border:1px solid rgba(255,255,255,.12);}
html[data-theme="dark"] .modal-close{background:#243A56;color:#fff;}
html[data-theme="dark"] .guild-search,html[data-theme="dark"] .guild-sort,html[data-theme="dark"] .archive-btn{background:#0F1F35;color:#E8EEF7;border-color:rgba(255,255,255,.18);}
html[data-theme="dark"] .job-fields{background:#071426;border-color:rgba(255,255,255,.15);}
html[data-theme="dark"] .check-row{color:#E8EEF7;}
html[data-theme="dark"] .form-note{background:#132D4D;color:#D8E9FF;}
html[data-theme="dark"] .cat-chip{background:#071426!important;color:#E8EEF7!important;border-color:rgba(255,255,255,.22)!important;}
.cat-chip.sel{font-weight:800;}
html[data-theme="dark"] .cat-chip.jinzai.sel{background:#5A240F!important;color:#FFE7D8!important;border-color:#FF8A4C!important;}
html[data-theme="dark"] .cat-chip.shizai.sel{background:#103822!important;color:#C9FAD9!important;border-color:#37C878!important;}
html[data-theme="dark"] .cat-chip.soudan.sel{background:#27184A!important;color:#E6D7FF!important;border-color:#9B6DFF!important;}
html[data-theme="light"] .post-btn{background:#fff;color:#334155;border-color:#CBD5E1;}
html[data-theme="light"] .post-btn.primary{background:#E8612A;color:#fff;border-color:#E8612A;}
html[data-theme="light"] .post-btn.danger{background:#FFF5F5;color:#9B1C1C;border-color:#F2B8B5;}
html[data-theme="light"] .comment-body{background:#F7FAFC;color:#1B2A3B;}
html[data-theme="light"] .comment-input{background:#fff;color:#1B2A3B;}
@media(max-width:520px){.guild-controls{grid-template-columns:1fr;}.post-details{grid-template-columns:1fr}.post-actions{flex-wrap:wrap}.post-btn{min-width:calc(50% - 4px)}}
</style>
</head>
<body>
<div class="app">
<header class="hdr">
  <button class="hdr-back" onclick="goBack()">
    <i class="ti ti-arrow-left"></i>戻る
  </button>
  <div style="text-align:right;">
    <p class="hdr-org" style="margin:0;">支部内情報共有</p>
    <p class="hdr-title" style="margin:0;font-size:14px;">DOKENギルド</p>
  </div>
</header>

<div class="content" style="padding-bottom:90px;">

  <!-- Hero -->
  <div style="background:linear-gradient(135deg,#1A7A4A,#2EA868);border-radius:16px;padding:18px 20px;margin-bottom:14px;display:flex;align-items:center;gap:16px;">
    <svg viewBox="0 0 70 70" width="60" height="60" style="flex-shrink:0;">
      <!-- 人物2人 -->
      <circle cx="22" cy="20" r="9" fill="rgba(255,255,255,.4)"/>
      <path d="M8 44 Q22 34 36 44" stroke="rgba(255,255,255,.5)" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle cx="48" cy="20" r="9" fill="rgba(255,255,255,.28)"/>
      <path d="M34 44 Q48 34 62 44" stroke="rgba(255,255,255,.35)" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- 会話バブル -->
      <rect x="10" y="4" width="22" height="12" rx="4" fill="rgba(255,255,255,.35)"/>
      <polygon points="14,16 11,22 20,16" fill="rgba(255,255,255,.35)"/>
      <line x1="14" y1="9" x2="28" y2="9" stroke="rgba(255,255,255,.6)" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="14" y1="13" x2="25" y2="13" stroke="rgba(255,255,255,.5)" stroke-width="1.5" stroke-linecap="round"/>
      <rect x="38" y="8" width="22" height="12" rx="4" fill="rgba(255,255,255,.22)"/>
      <polygon points="56,20 60,26 50,20" fill="rgba(255,255,255,.22)"/>
      <line x1="42" y1="13" x2="56" y2="13" stroke="rgba(255,255,255,.45)" stroke-width="1.5" stroke-linecap="round"/>
      <!-- 握手 -->
      <text x="35" y="66" text-anchor="middle" font-size="18" fill="rgba(255,255,255,.7)">🤝</text>
    </svg>
    <div>
      <p style="font-size:18px;font-weight:700;color:#fff;margin:0 0 3px;">DOKENギルド</p>
      <p style="font-size:13px;color:rgba(255,255,255,.7);margin:0;">人材・資材マッチング掲示板</p>
    </div>
  </div>

  <div class="guild-notice">
    <i class="ti ti-lock"></i>
    <p>新規投稿は支部へ通知されます。連絡先は公開せず、問い合わせは支部が取り次ぎます。</p>
  </div>
  <div class="guild-toolbar">
    <button id="sync-mode" onclick="syncPosts()"><i class="ti ti-refresh"></i> 最新に更新</button>
    <button id="admin-toggle" onclick="toggleAdmin()"><i class="ti ti-shield-lock"></i> 管理者</button>
  </div>
  <p class="sync-status" id="sync-status">ローカル表示中</p>

  <div class="guild-controls">
    <input class="guild-search" id="guild-search" type="search" maxlength="80" placeholder="地域・職種・投稿内容を検索" aria-label="投稿を検索" oninput="updateSearch(this.value)">
    <select class="guild-sort" id="guild-sort" aria-label="投稿の並べ替え" onchange="updateSort(this.value)">
      <option value="newest">新しい順</option>
      <option value="urgent">急募を優先</option>
    </select>
  </div>
  <button class="archive-btn" id="archive-toggle" type="button" onclick="toggleArchive()"><i class="ti ti-archive"></i> 過去・解決済みの投稿を表示</button>

  <!-- フィルタータブ -->
  <div class="tab-row">
    <button class="t-btn active" onclick="switchTab('all',this)">すべて</button>
    <button class="t-btn" onclick="switchTab('jinzai',this)">👷 人材募集</button>
    <button class="t-btn" onclick="switchTab('shizai',this)">🔧 資材・道具</button>
    <button class="t-btn" onclick="switchTab('soudan',this)">💬 相談</button>
  </div>

  <div id="post-list"></div>
</div>

<!-- 投稿FAB -->
<button class="fab" onclick="openModal()">
  <i class="ti ti-pencil-plus"></i>投稿する
</button>

<!-- 投稿モーダル -->
<div class="modal-overlay" id="modal" onclick="bgClose(event)">
  <div class="modal-sheet" style="position:relative;">
    <button class="modal-close" onclick="closeModal()"><i class="ti ti-x" style="font-size:16px;"></i></button>
    <p class="modal-title">新しく投稿する</p>

    <p style="font-size:12px;font-weight:600;color:var(--gray500);margin:0 0 8px;letter-spacing:.06em;">カテゴリを選択</p>
    <div class="cat-chips">
      <button class="cat-chip jinzai" onclick="selCat('jinzai',this)">👷 人材募集・お手伝い</button>
      <button class="cat-chip shizai" onclick="selCat('shizai',this)">🔧 資材・道具</button>
      <button class="cat-chip soudan" onclick="selCat('soudan',this)">💬 相談・情報共有</button>
    </div>

    <div class="input-group">
      <label>投稿内容</label>
      <textarea id="post-body" rows="5" maxlength="1200" placeholder="例：明日、上尾市内の現場で左官が1人足りません。日給2万円、午前7時〜17時。ご連絡ください。" style="resize:none;font-size:15px;"></textarea>
    </div>

    <label class="check-row"><input type="checkbox" id="post-urgent">急募として目立たせる</label>

    <div class="job-fields" id="job-fields">
      <p style="font-size:12px;font-weight:700;color:var(--gray600);margin:0 0 10px;">人材募集の詳細（任意）</p>
      <div class="grid2">
        <div class="input-group"><label>作業日</label><input type="date" id="post-work-date"></div>
        <div class="input-group"><label>作業時間</label><input type="text" id="post-work-time" maxlength="40" placeholder="例：7時〜17時"></div>
      </div>
      <div class="grid2">
        <div class="input-group"><label>職種</label><input type="text" id="post-trade" maxlength="40" placeholder="例：大工、左官"></div>
        <div class="input-group"><label>必要人数</label><input type="number" id="post-people" min="1" max="99" inputmode="numeric" placeholder="例：2"></div>
      </div>
      <div class="input-group"><label>条件</label><input type="text" id="post-conditions" maxlength="120" placeholder="例：経験者、単価応相談"></div>
    </div>

    <div class="grid2">
      <div class="input-group">
        <label>地域（任意）</label>
        <input type="text" id="post-area" maxlength="80" placeholder="例：上尾市、伊奈町">
      </div>
      <div class="input-group">
        <label>お名前・職種（任意）</label>
        <input type="text" id="post-name" maxlength="40" placeholder="例：大工 鈴木">
      </div>
    </div>

    <p class="form-note"><i class="ti ti-shield-check"></i> 個人の電話番号は画面に公開しません。問い合わせは上尾伊奈支部が取り次ぎます。</p>

    <button class="btn-primary" onclick="submitPost()">
      <i class="ti ti-send"></i>投稿する
    </button>
    <button class="btn-secondary" style="margin-top:8px;" onclick="closeModal()">キャンセル</button>
  </div>
</div>

<footer>埼玉土建一般労働組合 上尾伊奈支部｜TEL <a href="tel:048-773-9863">048-773-9863</a></footer>
</div>

<script src="assets/js/guild-config.js"></script>
<script>
const GUILD_CONFIG = window.DOKEN_GUILD_CONFIG || {};
let isAdmin = false;
let adminPinValue = '';

// ===== 初期サンプルデータ =====
const SAMPLE_POSTS = [
  {id:1, cat:'jinzai', emoji:'🪚', name:'大工 鈴木', area:'上尾市', time:'5分前',
   body:'明日（6/25）上尾市内の現場で大工が1名足りません。床張り作業です。日給2万円、朝7時〜17時。経験者歓迎。', tags:['上尾市','大工','急募','1日'], tel:'090-XXXX-XXXX', comments:[
    {emoji:'👷', name:'左官 田中', text:'自分、大工もできます！連絡してもいいですか？'},
  ]},
  {id:2, cat:'shizai', emoji:'🏗️', name:'鳶 田中組', area:'伊奈町', time:'2時間前',
   body:'単管パイプ（6m×50本）と足場板（2m×30枚）を格安で譲ります。引取り限定。状態良好。詳細はご連絡を。', tags:['足場材','譲渡','伊奈町'], tel:'048-XXX-XXXX', comments:[]},
  {id:3, cat:'soudan', emoji:'🔧', name:'設備 山本', area:'上尾市', time:'昨日',
   body:'一人親方で今年初めて確定申告をします。組合費や労災保険料って経費に入れていいんでしょうか？アドバイスお願いします。', tags:['確定申告','相談','一人親方'], tel:'', comments:[
    {emoji:'📋', name:'事務 佐藤', text:'組合費は経費になりますよ！詳しくは支部へ相談ください。048-773-9863'},
    {emoji:'🏗️', name:'鳶 田中組', text:'私も去年同じで迷いました。支部で教えてもらいました。'},
  ]},
  {id:4, cat:'jinzai', emoji:'🧱', name:'左官 小川', area:'桶川市', time:'昨日',
   body:'来月から2週間、桶川の現場で左官・タイル工を各1名募集。単価応相談。経験者優遇。埼玉土建組合員の方優先します。', tags:['左官','タイル','桶川市','長期'], tel:'090-XXXX-XXXX', comments:[]},
];

let posts = [];
let nextId = 1;
let currentTab = 'all';
let selectedCat = '';
let searchTerm = '';
let sortMode = 'newest';
let showArchived = false;

const CAT = {
  jinzai:{label:'人材募集',badge:'badge-jinzai'},
  shizai:{label:'資材・道具',badge:'badge-shizai'},
  soudan:{label:'相談',badge:'badge-soudan'},
};
const CAT_EMOJI = {jinzai:'👷', shizai:'🔧', soudan:'💬'};
const STATUS = {
  open:{label:'募集中',className:'status-open'},
  negotiating:{label:'交渉中',className:'status-negotiating'},
  closed:{label:'解決済み',className:'status-closed'}
};
const ARCHIVE_DAYS = 30;

function safeText(value, max){
  return String(value == null ? '' : value).replace(/[\u0000-\u001F\u007F]/g, ' ').trim().slice(0, max);
}
function normalizeComment(comment){
  if(!comment || typeof comment !== 'object') return null;
  const text = safeText(comment.text, 300);
  if(!text) return null;
  return {emoji:'💬', name:safeText(comment.name, 40) || '匿名', text};
}
function normalizePost(post){
  if(!post || typeof post !== 'object' || !CAT[post.cat]) return null;
  const id = Number(post.id);
  const body = safeText(post.body, 1200);
  if(!Number.isSafeInteger(id) || id <= 0 || !body) return null;
  const telRaw = safeText(post.tel, 40);
  const tel = /^[0-9+()\-\sXx]*$/.test(telRaw) ? telRaw : '';
  const status = STATUS[post.status] ? post.status : 'open';
  const people = Number(post.people);
  return {
    id,
    clientId:safeText(post.clientId, 80),
    cat:post.cat,
    emoji:CAT_EMOJI[post.cat],
    name:safeText(post.name, 40) || '匿名',
    area:safeText(post.area, 80),
    time:safeText(post.time, 40) || '日時不明',
    body,
    tags:Array.isArray(post.tags) ? post.tags.slice(0, 8).map(t=>safeText(t, 30)).filter(Boolean) : [],
    tel,
    comments:Array.isArray(post.comments) ? post.comments.map(normalizeComment).filter(Boolean).slice(0, 100) : [],
    status,
    urgent:post.urgent === true,
    workDate:safeText(post.workDate, 20),
    workTime:safeText(post.workTime, 40),
    trade:safeText(post.trade, 40),
    people:Number.isInteger(people) && people > 0 && people <= 99 ? people : null,
    conditions:safeText(post.conditions, 120),
    createdAt:safeText(post.createdAt, 40)
  };
}

function hasCloud(){ return Boolean(GUILD_CONFIG.apiUrl); }
function setStatus(text){ document.getElementById('sync-status').textContent = text; }
function readSavedPosts(){
  try{ return JSON.parse(localStorage.getItem('guild_posts') || '[]') || []; }
  catch(e){ return []; }
}
function savePosts(items){ localStorage.setItem('guild_posts', JSON.stringify(items)); }
function save(){ savePosts(posts); }
function postKey(post){
  return post.clientId || [post.cat, post.name, post.area, post.tel, post.body].map(v=>String(v||'').trim()).join('|');
}
function mergePosts(cloudPosts, localPosts){
  const merged = [];
  const seen = new Set();
  [...cloudPosts, ...localPosts].forEach(raw=>{
    const post = normalizePost(raw);
    if(!post) return;
    const key = postKey(post);
    if(seen.has(key)) return;
    seen.add(key);
    merged.push(post);
  });
  return merged;
}
function updateNextId(){
  nextId = Math.max(0, ...posts.map(p=>Number(p.id)||0)) + 1;
}
function loadLocal(){
  const saved = readSavedPosts();
  posts = mergePosts([], saved.length ? saved : (hasCloud() ? [] : SAMPLE_POSTS));
  updateNextId();
}

async function guildApi(action, payload={}){
  if(!hasCloud()) throw new Error('クラウドURLが未設定です');
  const res = await fetch(GUILD_CONFIG.apiUrl, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action, notifyEmail:GUILD_CONFIG.notifyEmail, ...payload})
  });
  if(!res.ok) throw new Error('通信に失敗しました');
  return res.json();
}

async function guildWrite(action, payload={}){
  const data = await guildApi(action, payload);
  if(!data || data.ok !== true) throw new Error((data && data.error) || '操作を完了できませんでした');
  return data;
}

async function syncPosts(){
  if(!hasCloud()){
    loadLocal();
    setStatus('クラウド未設定のため、この端末内の投稿を表示中');
    render();
    return;
  }
  try{
    setStatus('クラウドから読み込み中...');
    const data = await guildApi('list');
    const cloudPosts = Array.isArray(data.posts) ? data.posts : [];
    posts = mergePosts(cloudPosts, []);
    save();
    updateNextId();
    setStatus(posts.length ? 'クラウド共有中 / 投稿通知先: ' + (GUILD_CONFIG.notifyEmail || '未設定') : 'クラウド共有中 / まだ投稿はありません');
    render();
  }catch(e){
    console.error(e);
    loadLocal();
    setStatus('クラウド接続失敗。ローカル表示に切替中');
    render();
  }
}

// ===== 描画 =====
function postTimestamp(post){
  const created = Date.parse(post.createdAt || '');
  return Number.isFinite(created) ? created : Number(post.id) || 0;
}
function isArchived(post){
  if(post.status === 'closed') return true;
  const created = Date.parse(post.createdAt || '');
  return Number.isFinite(created) && Date.now() - created >= ARCHIVE_DAYS * 24 * 60 * 60 * 1000;
}
function formatWorkDate(value){
  const match = String(value || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return match ? Number(match[2]) + '/' + Number(match[3]) : String(value || '');
}
function detailHtml(post){
  const details = [
    post.workDate ? ['作業日', formatWorkDate(post.workDate)] : null,
    post.workTime ? ['時間', post.workTime] : null,
    post.trade ? ['職種', post.trade] : null,
    post.people ? ['人数', post.people + '人'] : null,
    post.conditions ? ['条件', post.conditions] : null
  ].filter(Boolean);
  if(!details.length) return '';
  return `<div class="post-details">${details.map(item=>`<div class="post-detail"><strong>${esc(item[0])}</strong> ${esc(item[1])}</div>`).join('')}</div>`;
}
function filteredPosts(){
  const query = searchTerm.toLowerCase();
  const filtered = posts.filter(post=>{
    if((currentTab !== 'all' && post.cat !== currentTab) || isArchived(post) !== showArchived) return false;
    if(!query) return true;
    return [post.name,post.area,post.body,post.trade,post.conditions,post.workDate,post.workTime,...(post.tags||[])]
      .join(' ').toLowerCase().includes(query);
  });
  return filtered.sort((a,b)=>{
    if(sortMode === 'urgent' && a.urgent !== b.urgent) return a.urgent ? -1 : 1;
    return postTimestamp(b) - postTimestamp(a);
  });
}
function render(){
  const list = document.getElementById('post-list');
  const filtered = filteredPosts();
  if(!filtered.length){
    list.innerHTML=`<div class="empty-state"><i class="ti ti-message-circle-off"></i><p>${showArchived?'過去・解決済みの投稿はありません':'条件に合う募集中の投稿はありません'}<br>${searchTerm?'検索条件を変えてください':'最初に投稿してみましょう！'}</p></div>`;
    return;
  }
  list.innerHTML = filtered.map(p=>`
    <div class="post-card ${p.cat}" id="pc-${p.id}">
      <div class="post-header">
        <div class="post-avatar">${esc(p.emoji||'👤')}</div>
        <div style="flex:1;">
          <p class="post-author">${esc(p.name||'匿名')}${p.area?` <span style="font-size:11px;color:var(--gray400);">📍${esc(p.area)}</span>`:''}</p>
          <p class="post-meta">${esc(p.time)}</p>
        </div>
        <span class="post-badge ${CAT[p.cat].badge}">${CAT[p.cat].label}</span>
      </div>
      <div class="post-flags">
        <span class="status-chip ${STATUS[p.status].className}">${STATUS[p.status].label}</span>
        ${p.urgent?'<span class="urgent-chip">急募</span>':''}
      </div>
      <p class="post-body">${esc(p.body)}</p>
      ${detailHtml(p)}
      <div class="post-tags">${(p.tags||[]).map(t=>`<span class="post-tag">${esc(t)}</span>`).join('')}</div>
      <div class="post-actions">
        <button class="post-btn" onclick="toggleComment(${p.id})">
          <i class="ti ti-message-circle"></i>コメント（${(p.comments||[]).length}）
        </button>
        <button class="post-btn primary" onclick="contactBranch(${p.id})">
          <i class="ti ti-phone"></i>支部へ問い合わせ
        </button>
        ${isAdmin ? `<button class="post-btn" onclick="advancePostStatus(${p.id})">
          <i class="ti ti-progress-check"></i>${p.status==='open'?'交渉中にする':p.status==='negotiating'?'解決済みにする':'再掲載する'}
        </button>` : ''}
        ${isAdmin ? `<button class="post-btn danger" onclick="deletePost(${p.id})">
          <i class="ti ti-trash"></i>削除
        </button>` : ''}
      </div>
      <div class="comment-area" id="ca-${p.id}">
        <div id="cl-${p.id}">
          ${(p.comments||[]).map(c=>`
            <div class="comment-item">
              <div class="comment-avatar">${esc(c.emoji||'💬')}</div>
              <div class="comment-body">
                <p class="comment-author">${esc(c.name||'匿名')}</p>
                <p class="comment-text">${esc(c.text)}</p>
              </div>
            </div>`).join('')}
        </div>
        <div class="comment-input-row">
          <input class="comment-input" id="ci-${p.id}" placeholder="コメントを入力…" onkeydown="if(event.key==='Enter')sendComment(${p.id})">
          <button class="comment-send" onclick="sendComment(${p.id})">送信</button>
        </div>
      </div>
    </div>`).join('');
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function switchTab(tab, btn){
  currentTab = tab;
  document.querySelectorAll('.t-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}
function updateSearch(value){ searchTerm = String(value || '').trim(); render(); }
function updateSort(value){ sortMode = value === 'urgent' ? 'urgent' : 'newest'; render(); }
function toggleArchive(){
  showArchived = !showArchived;
  const button = document.getElementById('archive-toggle');
  button.classList.toggle('active', showArchived);
  button.innerHTML = showArchived
    ? '<i class="ti ti-list"></i> 募集中の投稿へ戻る'
    : '<i class="ti ti-archive"></i> 過去・解決済みの投稿を表示';
  render();
}

// ===== コメント =====
function toggleComment(id){
  const el = document.getElementById('ca-'+id);
  el.classList.toggle('open');
  if(el.classList.contains('open')) document.getElementById('ci-'+id)?.focus();
}

async function sendComment(postId){
  const input = document.getElementById('ci-'+postId);
  const text = input.value.trim();
  if(!text) return;
  const p = posts.find(p=>p.id===postId);
  if(!p) return;
  if(hasCloud()){
    try{
      await guildWrite('comment', {postId, comment:{emoji:'👤', name:'あなた', text}});
      setStatus('コメントを送信しました。反映まで数秒かかる場合があります。');
      input.value='';
      await syncPosts();
    }catch(e){
      console.error(e);
      alert('コメントを送信できませんでした。通信環境を確認して、もう一度お試しください。');
    }
  }else{
    if(!p.comments) p.comments=[];
    p.comments.push({emoji:'👤', name:'あなた', text});
    input.value='';
    save();
    render();
  }
}

// ===== 支部へ問い合わせ =====
function contactBranch(id){
  const p = posts.find(p=>p.id===id);
  if(!p) return;
  if(confirm(`「${p.body.slice(0,40)}${p.body.length>40?'…':''}」について上尾伊奈支部へ電話しますか？\n048-773-9863`)){
    location.href = 'tel:0487739863';
  }
}

// ===== 投稿 =====
function openModal(){ document.getElementById('modal').classList.add('open'); }
function closeModal(){
  document.getElementById('modal').classList.remove('open');
  selectedCat='';
  document.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('sel'));
  document.getElementById('job-fields').classList.remove('open');
}
function bgClose(e){ if(e.target===document.getElementById('modal')) closeModal(); }

function selCat(cat, btn){
  selectedCat = cat;
  document.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('sel'));
  btn.classList.add('sel');
  document.getElementById('job-fields').classList.toggle('open', cat === 'jinzai');
}

async function submitPost(){
  if(!selectedCat){ alert('カテゴリを選択してください'); return; }
  const body = document.getElementById('post-body').value.trim();
  if(!body){ alert('投稿内容を入力してください'); return; }
  const area = document.getElementById('post-area').value.trim();
  const name = document.getElementById('post-name').value.trim() || '匿名';
  const tags = [area, CAT[selectedCat].label].filter(Boolean);
  const peopleValue = Number(document.getElementById('post-people').value);

  const EMOJIS = {jinzai:'👷',shizai:'🔧',soudan:'💬'};
  const newPost = {
    id: nextId++, clientId:'local-' + Date.now() + '-' + Math.random().toString(36).slice(2), cat: selectedCat,
    emoji: EMOJIS[selectedCat], name, area, time:'たった今',
    body, tags, tel:'', comments:[], status:'open',
    urgent:document.getElementById('post-urgent').checked,
    workDate:selectedCat==='jinzai' ? document.getElementById('post-work-date').value : '',
    workTime:selectedCat==='jinzai' ? document.getElementById('post-work-time').value.trim() : '',
    trade:selectedCat==='jinzai' ? document.getElementById('post-trade').value.trim() : '',
    people:selectedCat==='jinzai' && Number.isInteger(peopleValue) && peopleValue>0 ? peopleValue : null,
    conditions:selectedCat==='jinzai' ? document.getElementById('post-conditions').value.trim() : '',
    createdAt:new Date().toISOString()
  };
  if(hasCloud()){
    try{
      setStatus('クラウドへ投稿中...');
      await guildWrite('create', {post:newPost});
      setStatus('投稿しました。支部へメール通知しました。');
      await syncPosts();
    }catch(e){
      console.error(e);
      alert('投稿を送信できませんでした。入力内容は残しています。通信環境を確認して、もう一度お試しください。');
      return;
    }
  }else{
    posts.unshift(newPost);
    save();
  }
  closeModal();
  currentTab='all';
  document.querySelectorAll('.t-btn')[0].click();
  // フォームリセット
  ['post-body','post-area','post-name','post-work-date','post-work-time','post-trade','post-people','post-conditions'].forEach(id=>{ document.getElementById(id).value=''; });
  document.getElementById('post-urgent').checked=false;
  render();
}

async function toggleAdmin(){
  if(isAdmin){
    isAdmin = false;
    document.getElementById('admin-toggle').classList.remove('active');
    render();
    return;
  }
  const pin = prompt('管理者PINを入力してください');
  if(!pin) return;
  try{
    await guildWrite('verifyAdmin', {adminPin:pin});
    adminPinValue = pin;
    isAdmin = true;
    document.getElementById('admin-toggle').classList.add('active');
    setStatus('管理者モードです');
    render();
  }catch(e){
    alert('管理者PINが違います。');
  }
}

async function advancePostStatus(id){
  if(!isAdmin) return;
  const post = posts.find(item=>item.id===id);
  if(!post) return;
  const nextStatus = post.status === 'open' ? 'negotiating' : post.status === 'negotiating' ? 'closed' : 'open';
  const label = STATUS[nextStatus].label;
  if(!confirm(`この投稿を「${label}」に変更しますか？`)) return;
  try{
    await guildWrite('updateStatus', {postId:id, status:nextStatus, adminPin:adminPinValue});
    setStatus(`「${label}」へ変更しました。`);
    await syncPosts();
  }catch(e){
    alert('状態を変更できませんでした。通信環境を確認してください。');
  }
}

async function deletePost(id){
  if(!isAdmin) return;
  if(!confirm('この投稿を削除しますか？')) return;
  const old = posts;
  posts = posts.filter(p=>p.id!==id);
  if(hasCloud()){
    try{
      await guildWrite('delete', {postId:id, adminPin:adminPinValue});
      setStatus('投稿を削除しました。');
      await syncPosts();
    }catch(e){
      console.error(e);
      alert('クラウド削除に失敗しました。');
      posts = old;
      render();
    }
  }else{
    save();
    render();
  }
}

window.DokenGuild = Object.freeze({
  normalizePost,
  isArchived,
  mergePosts,
  postTimestamp
});

syncPosts();
</script>
