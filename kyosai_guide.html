<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>総合共済 申請ナビ｜埼玉土建 上尾伊奈支部</title>
<link rel="stylesheet" href="common.css"><link rel="stylesheet" href="assets/css/tabler-icons.min.css">
<style>
:root{--navy:#07172b;--panel:#102947;--line:#31516f;--ink:#f5f8fc;--sub:#c0d0df;--orange:#ef642b;--mint:#39c6a0}
*{box-sizing:border-box}body{margin:0;background:var(--navy);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.65}.wrap{max-width:760px;margin:auto;padding:18px 16px 130px}.back{display:inline-flex;min-height:44px;align-items:center;gap:6px;color:inherit;text-decoration:none;font-weight:700}.hero{margin:12px 0 18px;padding:22px;border:1px solid #31658a;border-radius:22px;background:linear-gradient(135deg,#12365c,#0a2038);box-shadow:0 14px 36px #0005}.hero h1{margin:0;font-size:clamp(25px,7vw,38px);letter-spacing:.02em}.hero p{margin:8px 0 0;color:var(--sub)}.steps{display:flex;gap:6px;margin-top:17px}.steps span{flex:1;height:5px;border-radius:5px;background:#42617f}.steps span.on{background:var(--orange)}h2{font-size:19px;margin:24px 0 10px}.choices{display:grid;grid-template-columns:1fr;gap:10px}.choice{width:100%;min-height:72px;padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);font:inherit;font-weight:700;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:center}.choice[aria-pressed="true"]{border:2px solid #ff8a55;background:#213b58;box-shadow:0 0 0 3px #ef642b2b}.choice small{display:block;color:var(--sub);font-weight:500}.result{margin-top:18px}.card{border:1px solid var(--line);border-radius:18px;background:var(--panel);overflow:hidden}.card-head{padding:17px;background:linear-gradient(135deg,#173b63,#102b49)}.card-head h2{margin:0;font-size:22px}.pill{display:inline-block;margin-bottom:7px;padding:3px 9px;border-radius:99px;background:#dff9ef;color:#075844;font-size:12px;font-weight:800}.section{padding:16px;border-top:1px solid var(--line)}.section h3{margin:0 0 8px;font-size:16px;color:#ffb082}.section p{margin:5px 0;color:var(--sub)}.deadline{display:flex;gap:9px;align-items:flex-start;padding:12px;border-radius:12px;background:#3b2918;color:#ffe1b6}.check{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #29435d;cursor:pointer}.check:last-child{border-bottom:0}.check input{width:24px;height:24px;flex:none;accent-color:var(--mint)}.progress{height:8px;background:#29435d;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--mint);transition:.2s}.notice{margin-top:18px;padding:14px;border-left:4px solid #f3ad45;border-radius:10px;background:#302717;color:#ffe8c7}.empty{padding:28px;text-align:center;color:var(--sub)}[hidden]{display:none!important}@media(max-width:390px){.wrap{padding-inline:12px}.choice{font-size:14px}.hero{padding:18px}}
html[data-theme="light"] body{--navy:#f3f7fb;--panel:#fff;--line:#b8c9d9;--ink:#102238;--sub:#475d72;background:var(--navy)}html[data-theme="light"] .hero{background:linear-gradient(135deg,#eaf5ff,#fff);box-shadow:0 12px 28px #163b5a16}html[data-theme="light"] .card-head{background:#e8f3fc}html[data-theme="light"] .deadline{background:#fff1d9;color:#68400b}html[data-theme="light"] .notice{background:#fff6e6;color:#61400e}
</style>
</head>
<body><main class="wrap">
<a class="back" href="index.html#tetsuzuki"><i class="ti ti-arrow-left"></i> 戻る</a>
<section class="hero"><div class="pill">2026年度版</div><h1>総合共済 申請ナビ</h1><p>できごとを選ぶと、対象条件・期限・必要書類が一画面で分かります。</p><div class="steps"><span class="on"></span><span></span><span></span></div></section>
<h2>何について申請しますか？</h2><div class="choices" id="choices" aria-label="申請内容"></div>
<div class="result" id="result" aria-live="polite"><div class="empty">上から申請内容を選んでください。</div></div>
<div class="notice"><strong>迷ったら申請書を取る前に支部へ</strong><br>該当条件や追加書類は事情により異なる場合があります。上尾伊奈支部 048-773-9863</div>
</main><script src="assets/js/navigation.js"></script><script>
const common='原則、事由が発生した翌日から1年以内。脱退後は3か月以内（死亡の場合は6か月以内）です。';
const items=[
{id:'medical',icon:'🏥',label:'病気・けが',sub:'4日以上仕事を休んだ',title:'傷病見舞金',target:'病気・けが等により、連続4日以上仕事ができなかった場合。区分により対象となる療養期間が異なります。',docs:['傷病見舞金申請書','申請書内の医療機関証明（休業・療養期間が分かるもの）','労災・交通事故・組合活動中の事故の場合は、事故区分に応じた追加書類を支部へ確認'],pdf:'01-medical-benefit-2026.pdf'},
{id:'life',icon:'🎉',label:'結婚・出生・就学など',sub:'生活のお祝い・家族死亡',title:'共済金支給申請',target:'結婚、出生、小中学校入学、中学卒業、20歳、77・80・83・88歳、配偶者死亡、家族死亡が対象です。',docs:['共済金支給申請書（1つの事由につき1枚）','該当事由が確認できる書類（戸籍、続柄入り住民票、母子手帳、入学通知書、卒業証明書、本人確認書類、死亡診断書・会葬礼状などの指定書類）'],pdf:'02-mutual-aid-benefit-2026.pdf'},
{id:'housing',icon:'🏠',label:'住宅が被災した',sub:'火災・自然災害',title:'住宅災害見舞金',target:'居住の本拠となる家屋・家財に、火災や災害で3万円以上の損害があった場合。',docs:['住宅災害見舞金申請書','関係官署発行の罹災証明書（コピー可）','現場の写真','領収書または見積書（3万円以上の損害が分かるもの。一部損は必須）'],pdf:'03-housing-disaster-2026.pdf'},
{id:'lodging',icon:'🧳',label:'宿泊旅行をした',sub:'60歳以上・年度2回まで',title:'宿泊補助金',target:'60歳以上の組合員本人が、旅館業法上の国内施設に宿泊した場合。年度内2回まで、各3,000円。',docs:['宿泊補助金申請書','宿泊施設の証明欄への証明、または本人氏名・宿泊日・施設名・住所・電話番号が分かる領収書のコピー','団体一括申請は、行事チラシと共済番号入り参加者名簿も必要'],pdf:'04-lodging-subsidy-2026.pdf'},
{id:'unionAccident',icon:'🩹',label:'組合活動中に事故',sub:'本人・同一生計の家族',title:'組合活動中の事故見舞金',target:'共済型や共済加入の有無にかかわらず、組合員と同一生計の家族が対象です。',docs:['組合活動中の事故見舞金申請書','事故証明書（必須）','申請書裏面の事故発生状況報告書','死亡・廃疾の場合は死亡診断書・診断書、相続人確認書類など該当欄の書類'],pdf:'05-union-activity-accident-2025.pdf'},
{id:'special',icon:'👤',label:'特別組合員の申請',sub:'宿泊・じん肺等',title:'特別組合員見舞金',target:'60歳以上の宿泊補助、または本人がじん肺・アスベスト関連疾患で労災・救済制度を申請した場合。',docs:['特別組合員見舞金申請書','宿泊：施設証明または必要事項が分かる本人宛領収書コピー','じん肺等：労災休業補償給付支給請求書のコピー','石綿救済制度の場合：救済給付調整金請求書のコピー'],pdf:'06-special-member-benefit-2026.pdf'},
{id:'qualification',icon:'🏅',label:'資格を取得した',sub:'資格取得祝金',title:'資格取得祝金',target:'加入日の翌月1日以降に対象資格を取得した場合。対象区分・金額は申請書内の2026年度一覧で確認します。',docs:['資格取得祝金申請書','資格名と取得日・合格日が確認できる合格証・資格証・修了証等のコピー','カード型資格証は表裏のコピー'],pdf:'07-qualification-benefit-2026.pdf'},
{id:'support',icon:'🤲',label:'支援金を申請したい',sub:'じん肺・適用除外・臓器提供',title:'支援金',target:'じん肺・アスベスト関連の労災等申請、適用除外法人事業主、または臓器提供が対象です。',docs:['支援金支給申請書','じん肺等：様式8号または救済給付調整金請求書のコピー','適用除外：本人の資格確認書等・適用通知書・適用除外承認証の3点','臓器提供：医療機関の診断書・証明書など提供を確認できる書類'],pdf:'08-support-benefit-2026.pdf'},
{id:'death',icon:'🕊️',label:'本人死亡・重度障害',sub:'C型専用',title:'本人死亡弔慰金・重度障害',target:'C型共済の本人死亡または本人重度障害。重度障害は申請前に必ず支部へ相談してください。',docs:['C型専用支給申請書','本人死亡：死亡診断書','本人死亡：死亡と相続人が確認できる戸籍（必要に応じ出生から死亡まで）','重度障害：組合書式の後遺障害診断書（支部から受け取る）'],pdf:'09-member-death-disability-2026.pdf',office:true}
];
const base='assets/pdfs/kyosai/';const choices=document.getElementById('choices'),result=document.getElementById('result');
items.forEach(x=>{const b=document.createElement('button');b.className='choice';b.type='button';b.dataset.id=x.id;b.setAttribute('aria-pressed','false');const a=document.createElement('span');a.textContent=x.icon+' '+x.label;const s=document.createElement('small');s.textContent=x.sub;b.append(a,s);b.onclick=()=>show(x,b);choices.append(b)});
function show(x,button){document.querySelectorAll('.choice').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelectorAll('.steps span').forEach((s,i)=>s.classList.toggle('on',i<2));result.textContent='';const card=document.createElement('article');card.className='card';const head=document.createElement('div');head.className='card-head';const pill=document.createElement('span');pill.className='pill';pill.textContent='申請案内';const h=document.createElement('h2');h.textContent=x.icon+' '+x.title;head.append(pill,h);card.append(head);card.append(section('対象になる目安',x.target));const d=section('申請期限','');const dl=document.createElement('div');dl.className='deadline';dl.textContent='⏱ '+common;d.append(dl);card.append(d);const sec=document.createElement('section');sec.className='section';const h3=document.createElement('h3');h3.textContent='必要書類チェック';const prog=document.createElement('div');prog.className='progress';const bar=document.createElement('i');prog.append(bar);sec.append(h3,prog);x.docs.forEach((v,i)=>{const lab=document.createElement('label');lab.className='check';const input=document.createElement('input');input.type='checkbox';input.checked=localStorage.getItem('kyosai:'+x.id+':'+i)==='1';const span=document.createElement('span');span.textContent=v;input.onchange=()=>{try{localStorage.setItem('kyosai:'+x.id+':'+i,input.checked?'1':'0')}catch(e){}update()};lab.append(input,span);sec.append(lab)});card.append(sec);result.append(card);function update(){const all=[...sec.querySelectorAll('input')],n=all.filter(i=>i.checked).length;bar.style.width=(n/all.length*100)+'%';document.querySelectorAll('.steps span')[2].classList.toggle('on',n===all.length)}update();result.scrollIntoView({behavior:'smooth',block:'start'})}
function section(title,text){const s=document.createElement('section');s.className='section';const h=document.createElement('h3');h.textContent=title;const p=document.createElement('p');p.textContent=text;s.append(h,p);return s}
</script></body></html>
