name: Portal quality check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run portal quality check
        run: node scripts/quality-check.js
      - name: Run DOKEN Guild regression check
        run: node scripts/guild-regression-check.js
      - name: Run DOKEN Guild template paragraph check
        run: node scripts/guild-template-check.js
