<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
<title id="title">まちの危険をスマホで報告するイラスト</title>
<desc id="desc">道路のひび割れを見つけた建設職人がスマートフォンで撮影している場面</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#DFF5FF"/><stop offset="1" stop-color="#BFE7F4"/></linearGradient>
  <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#75879B"/><stop offset="1" stop-color="#536475"/></linearGradient>
  <linearGradient id="vest" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFB24A"/><stop offset="1" stop-color="#E8612A"/></linearGradient>
  <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123B64"/><stop offset="1" stop-color="#1A5FA8"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#17324D" flood-opacity=".2"/></filter>
</defs>
