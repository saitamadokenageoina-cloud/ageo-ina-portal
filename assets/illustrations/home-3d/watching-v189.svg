<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
<title id="title">まちの危険をスマホで報告する3D風イラスト</title>
<desc id="desc">建設職人が道路のひび割れをスマートフォンで撮影している、明るい立体感のあるイラスト</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EAF7FF"/><stop offset=".55" stop-color="#DDEFF7"/><stop offset="1" stop-color="#CFE2E9"/></linearGradient>
  <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8C9AA8"/><stop offset="1" stop-color="#5B6978"/></linearGradient>
  <linearGradient id="helmet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFD85A"/><stop offset=".55" stop-color="#F7B92C"/><stop offset="1" stop-color="#D99312"/></linearGradient>
  <linearGradient id="vest" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF9A57"/><stop offset=".55" stop-color="#EF6C2F"/><stop offset="1" stop-color="#C64B18"/></linearGradient>
  <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F9FBFD"/><stop offset="1" stop-color="#D9E2EA"/></linearGradient>
  <linearGradient id="pants" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#294B69"/><stop offset="1" stop-color="#152F48"/></linearGradient>
  <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#214C71"/><stop offset="1" stop-color="#0D263E"/></linearGradient>
  <radialGradient id="face" cx="35%" cy="28%" r="75%"><stop stop-color="#FFD9BC"/><stop offset=".7" stop-color="#F0B58D"/><stop offset="1" stop-color="#D99570"/></radialGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop stop-color="#FFFFFF" stop-opacity=".9"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  <filter id="softShadow" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#163047" flood-opacity=".22"/></filter>
  <filter id="smallShadow" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#17324D" flood-opacity=".18"/></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
</defs>

<rect width="960" height="640" rx="38" fill="url(#bg)"/>
<circle cx="805" cy="112" r="110" fill="url(#glow)" opacity=".8"/>

<!-- softly blurred town background -->
<g opacity=".72" filter="url(#blur)">
  <rect x="30" y="210" width="210" height="155" rx="26" fill="#F7FAFC"/>
  <rect x="105" y="152" width="130" height="205" rx="18" fill="#D8E5EC"/>
  <rect x="265" y="188" width="170" height="170" rx="22" fill="#E9F1F5"/>
  <circle cx="120" cy="305" r="74" fill="#8ED19A"/>
  <circle cx="318" cy="302" r="62" fill="#78C18A"/>
</g>

<!-- curb + road -->
<path d="M0 346h960v294H0z" fill="url(#road)"/>
<path d="M0 338h960v38H0z" fill="#DDE4EA"/>
<path d="M0 354h960" stroke="#F7F9FB" stroke-width="6" opacity=".65"/>
<path d="M58 530h255" stroke="#F8D35A" stroke-width="18" stroke-linecap="round" opacity=".92"/>

<!-- crack as main hazard -->
<g filter="url(#smallShadow)">
  <path d="M568 488l-52 34 38 22-62 39 50 24" fill="none" stroke="#253744" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M568 489l43 21-25 27 50 25" fill="none" stroke="#394B58" stroke-width="9" stroke-linecap="round"/>
</g>
<ellipse cx="555" cy="540" rx="145" ry="78" fill="#132434" opacity=".10"/>

<!-- orange safety cone -->
<g transform="translate(95 385)" filter="url(#smallShadow)">
  <ellipse cx="56" cy="148" rx="64" ry="18" fill="#1B2B38" opacity=".16"/>
  <path d="M56 12L104 130H8z" fill="url(#vest)"/>
  <path d="M27 77h59l10 25H18z" fill="#F9FAFB" opacity=".95"/>
  <rect x="0" y="126" width="112" height="23" rx="11" fill="#C94819"/>
</g>

<!-- worker, designed as rounded cinematic 3D object -->
<g transform="translate(520 72)" filter="url(#softShadow)">
  <ellipse cx="190" cy="485" rx="150" ry="34" fill="#1B3246" opacity=".18"/>

  <!-- legs -->
  <path d="M126 344c28-8 56-6 78 4l-14 128h-61z" fill="url(#pants)"/>
  <path d="M205 350c27-7 54-3 75 8l21 118h-62z" fill="url(#pants)"/>
  <path d="M118 470h89c6 0 12 6 12 12v10H101v-7c0-9 7-15 17-15z" fill="#101F2D"/>
  <path d="M236 470h92c7 0 13 6 13 13v9H221v-8c0-8 7-14 15-14z" fill="#101F2D"/>

  <!-- torso -->
  <path d="M105 183c22-35 61-54 105-54 44 0 84 19 106 54l19 173H87z" fill="url(#shirt)"/>
  <path d="M121 190c18-24 46-38 77-38h30c31 0 60 14 78 39l9 164H111z" fill="url(#vest)"/>
  <path d="M142 193h125l8 36H135z" fill="#FFF2D5" opacity=".95"/>
  <path d="M134 274h150l5 25H130z" fill="#FFF3D5" opacity=".9"/>
  <path d="M198 159v196" stroke="#B84B1A" stroke-width="8" opacity=".32"/>

  <!-- head -->
  <circle cx="210" cy="104" r="69" fill="url(#face)"/>
  <path d="M153 95c4-43 28-71 59-76 33-5 64 12 78 47l-7 35c-18-16-42-24-72-24-24 0-43 6-58 18z" fill="#2A4054"/>
  <path d="M139 83h145l-17-58H158z" fill="url(#helmet)"/>
  <rect x="170" y="18" width="84" height="20" rx="10" fill="#FFE786"/>
  <ellipse cx="188" cy="108" rx="7" ry="10" fill="#24384A"/>
  <ellipse cx="236" cy="108" rx="7" ry="10" fill="#24384A"/>
  <path d="M190 136c15 11 31 11 46 0" fill="none" stroke="#A85B44" stroke-width="6" stroke-linecap="round"/>
  <circle cx="169" cy="127" r="11" fill="#F5A98E" opacity=".35"/>
  <circle cx="251" cy="127" r="11" fill="#F5A98E" opacity=".35"/>

  <!-- arms -->
  <path d="M123 215c-31 28-46 58-48 94" fill="none" stroke="#EAAF89" stroke-width="38" stroke-linecap="round"/>
  <path d="M292 214c32 18 56 42 69 72" fill="none" stroke="#EAAF89" stroke-width="38" stroke-linecap="round"/>

  <!-- phone held toward crack -->
  <g transform="translate(321 246) rotate(-14)">
    <rect width="105" height="158" rx="22" fill="url(#phone)"/>
    <rect x="10" y="14" width="85" height="112" rx="13" fill="#DDF7FF"/>
    <circle cx="53" cy="143" r="7" fill="#D7E3EA"/>
    <circle cx="82" cy="28" r="7" fill="#0B1721"/>
    <path d="M24 96l20-21 16 14 20-30" fill="none" stroke="#E8612A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</g>

<!-- floating camera cue, matching glossy app-card look -->
<g transform="translate(250 118)" filter="url(#smallShadow)">
  <rect width="190" height="120" rx="32" fill="#FFFFFF" opacity=".94"/>
  <circle cx="66" cy="60" r="34" fill="#E8F5EE"/>
  <circle cx="66" cy="60" r="21" fill="none" stroke="#1A7A4A" stroke-width="10"/>
  <circle cx="104" cy="42" r="7" fill="#F0B429"/>
  <path d="M126 40h35M126 61h25M126 82h30" stroke="#476172" stroke-width="9" stroke-linecap="round" opacity=".85"/>
</g>

<!-- highlight glints -->
<circle cx="745" cy="175" r="10" fill="#FFFFFF" opacity=".85"/>
<circle cx="776" cy="153" r="6" fill="#FFFFFF" opacity=".62"/>
<circle cx="718" cy="140" r="5" fill="#FFFFFF" opacity=".7"/>
</svg>