<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資料本棚｜埼玉土建 上尾伊奈支部</title>
<link rel="stylesheet" href="assets/css/tabler-icons.min.css">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="assets/css/bookshelf-v191.css?v=191">
</head>
<body>
<div class="app">
<header class="hdr">
  <button class="hdr-back" onclick="goBack()"><i class="ti ti-arrow-left"></i>戻る</button>
  <div style="text-align:right;">
    <p class="hdr-org" style="margin:0;">埼玉土建 上尾伊奈支部</p>
    <p class="hdr-title" style="margin:0;font-size:14px;">資料本棚</p>
  </div>
</header>

<div class="content">
  <div class="shelf-hero">
    <i class="ti ti-books"></i>
    <div>
      <h2>デジタル資料本棚</h2>
      <p>表紙を見ながら選び、「読む」でデジタルブックとして開けます。</p>
    </div>
  </div>

  <div class="search-box">
    <i class="ti ti-search"></i>
    <input type="text" id="search" placeholder="資料名・キーワードで検索" aria-label="資料を検索">
  </div>

  <div class="filter-row" id="filters" aria-label="資料カテゴリー">
    <button class="filter-btn active" onclick="setFilter('all',this)">すべて</button>
    <button class="filter-btn" onclick="setFilter('組合案内',this)">組合案内</button>
    <button class="filter-btn" onclick="setFilter('国保',this)">国保</button>
    <button class="filter-btn" onclick="setFilter('学習資料',this)">学習資料</button>
  </div>

  <div class="alert alert-info bookshelf-note">
    <i class="ti ti-info-circle"></i>
    <span>表紙はPDFの1ページ目から自動表示します。表紙をタップしても読むことができます。</span>
  </div>

  <div class="bookshelf-stage">
    <div id="doc-list"></div>
  </div>
  <div id="empty" class="empty">
    <i class="ti ti-file-search" style="font-size:38px;display:block;margin-bottom:8px;"></i>
    該当する資料がありません。
  </div>
</div>

<footer>埼玉土建一般労働組合 上尾伊奈支部｜TEL <a href="tel:048-773-9863">048-773-9863</a><br><span data-app-version style="font-size:10px;color:var(--gray400);">アプリ版数を確認中</span></footer>
</div>

<script src="assets/js/bookshelf.js?v=191"></script>
<script src="assets/js/pdfjs-loader-v191.js?v=191"></script>
<script src="assets/js/bookshelf-view-v191.js?v=191"></script>
<script src="assets/js/navigation.js"></script>
</body>
</html>
